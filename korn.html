    h += '<div class="chips">' + chip("Din pris", c.be) + chip("Mod sidste år", c.percentil)
      + chip("Betaler markedet for lagring?", c.carry) + chip("Din plan", c.plan)
      + chip("Årstid", c.saeson) + chip("Risiko", c.risiko) + "</div>";
    h += '<p class="saeson-note">' + esc(v.saeson_note) + "</p>";
  }
  h += '<p class="small muted" style="margin-top:10px">Anbefalingen er regnet ud af dine egne tal. Er tallene forkerte eller gamle, er anbefalingen forkert.</p>';
  if (fuld) {
    h += '<div class="btnrow noprint">'
      + '<button class="primary" data-act="salg" data-id="' + esc(v.parti_id) + '">Registrér salg</button>'
      + '<button data-act="kopi" data-id="' + esc(v.parti_id) + '">Kopiér handelsbesked</button>'
      + '<button data-act="hvorfor" data-id="' + esc(v.parti_id) + '">Se hvorfor</button>'
      + "</div>";
  }
  h += "</div>";
  return h;
}

function hurtigPrisKort(v) {
  const sidst = S.prislog.slice().sort((a, b) => (a.dato < b.dato ? -1 : 1)).pop();
  const ps = S.ui.prisSidst;
  return '<div class="card noprint"><h2>Log dagens pris</h2>'
    + (sidst ? '<p class="small muted">Sidst: ' + esc(nf(sidst.pris_kr_hkg, 2)) + " kr/hkg (" + esc(DK_DATO(sidst.dato)) + ")</p>" : "")
    + '<div class="seg" style="margin-bottom:10px">'
    + '<button type="button" data-act="prisafgrode" data-v="hvede" aria-pressed="' + (ps.afgrode === "hvede") + '">Hvede</button>'
    + '<button type="button" data-act="prisafgrode" data-v="raps" aria-pressed="' + (ps.afgrode === "raps") + '">Raps</button></div>'
    + (ps.afgrode === "hvede" ? '<div class="seg" style="margin-bottom:10px">'
      + '<button type="button" data-act="priskval" data-v="broed" aria-pressed="' + (ps.kvalitet === "broed") + '">Brødhvede</button>'
      + '<button type="button" data-act="priskval" data-v="foder" aria-pressed="' + (ps.kvalitet === "foder") + '">Foderhvede</button></div>' : "")
    + '<div class="stepper"><button type="button" data-act="pris-" data-v="5">−5</button>'
    + '<button type="button" data-act="pris-" data-v="1">−1</button>'
    + '<input type="text" inputmode="decimal" autocomplete="off" id="prisInput" placeholder="kr/hkg" value="">'
    + '<button type="button" data-act="pris+" data-v="1">+1</button>'
    + '<button type="button" data-act="pris+" data-v="5">+5</button></div>'
    + '<div class="hint" id="prisOmregn">Indtast i kr/hkg. Tallet vises også som kr/t og EUR/t.</div>'
    + '<div class="btnrow"><button class="primary" data-act="gempris">Gem prisen</button>'
    + '<button data-act="fane" data-v="pris">Flere muligheder</button></div></div>';
}
</script>

<script>
"use strict";
/* ---------------------------------------------------------- Pris-fanen */
const PRIS_BAAND = { hvede: [90, 330], raps: [220, 700] };

function renderPris() {
  const idag = todayISO();
  const ps = S.ui.prisSidst;
  let h = '<div class="card"><h2>Log en pris</h2>'
    + '<p class="small muted">Buddet fra din grovvare, ab gård, brutto. Alt regnes derefter netto med dine typiske fradrag.</p>'
    + '<div class="field"><label>Afgrøde</label><div class="seg">'
    + '<button type="button" data-act="prisafgrode" data-v="hvede" aria-pressed="' + (ps.afgrode === "hvede") + '">Hvede</button>'
    + '<button type="button" data-act="prisafgrode" data-v="raps" aria-pressed="' + (ps.afgrode === "raps") + '">Raps</button></div></div>';
  if (ps.afgrode === "hvede") h += '<div class="field"><label>Kvalitet</label><div class="seg">'
    + '<button type="button" data-act="priskval" data-v="broed" aria-pressed="' + (ps.kvalitet === "broed") + '">Brødhvede</button>'
    + '<button type="button" data-act="priskval" data-v="foder" aria-pressed="' + (ps.kvalitet === "foder") + '">Foderhvede</button></div></div>';
  h += '<div class="field"><label>Levering</label><div class="seg">'
    + '<button type="button" data-act="prisper" data-v="spot" aria-pressed="' + (ps.leveringsperiode !== "ny_hoest") + '">Nu / i år</button>'
    + '<button type="button" data-act="prisper" data-v="ny_hoest" aria-pressed="' + (ps.leveringsperiode === "ny_hoest") + '">Ny høst</button></div>'
    + '<div class="hint">Gammel og ny høst ligger typisk 15–30 kr/hkg fra hinanden. De holdes derfor adskilt i statistikken.</div></div>'
    + '<div class="field"><label>Enhed</label><div class="seg">'
    + '<button type="button" data-act="prisenhed" data-v="kr_hkg" aria-pressed="true">kr/hkg</button>'
    + '<button type="button" data-act="prisenhed" data-v="kr_t" aria-pressed="false">kr/t</button>'
    + '<button type="button" data-act="prisenhed" data-v="EUR_t" aria-pressed="false">EUR/t</button></div></div>'
    + '<div class="stepper"><button type="button" data-act="pris-" data-v="5">−5</button>'
    + '<button type="button" data-act="pris-" data-v="1">−1</button>'
    + '<input type="text" inputmode="decimal" autocomplete="off" id="prisInput" placeholder="pris">'
    + '<button type="button" data-act="pris+" data-v="1">+1</button>'
    + '<button type="button" data-act="pris+" data-v="5">+5</button></div>'
    + '<div class="hint" id="prisOmregn"></div>'
    + '<div class="grid2" style="margin-top:12px">'
    + '<div class="field"><label for="prisDato">Dato</label><input type="date" id="prisDato" value="' + idag + '"></div>'
    + '<div class="field"><label for="prisKilde">Kilde</label><input type="text" id="prisKilde" placeholder="fx DLG, telefon" value="' + esc(ps.kilde || "") + '"></div></div>'
    + '<div class="btnrow"><button class="primary" data-act="gempris">Gem prisen</button></div></div>';

  const p0 = aktivePartier(idag)[0] || S.partier[0];
  const kval = p0 ? partiKvalitet(p0) : (ps.afgrode === "raps" ? "raps" : ps.kvalitet);
  const afg = p0 ? p0.afgrode : ps.afgrode;
  const periode = p0 ? prisPeriodeForParti(p0, idag) : "spot";
  const stat = prisstat(S.prislog, afg, kval, periode, idag);
  const be = p0 ? beregnBE(p0, S.parametre) : null;
  h += '<div class="card"><h2>Prisudvikling — ' + esc(afg === "raps" ? "raps" : kval === "broed" ? "brødhvede" : "foderhvede") + "</h2>"
    + '<div class="graf-wrap" id="graf"></div>';
  if (stat.n) {
    h += '<div class="kv"><span>Observationer (12 mdr.)</span><span>' + stat.n + " over " + stat.spaend + " dage</span></div>"
      + '<div class="kv"><span>Min / median / max</span><span>' + esc(nf(stat.min, 0) + " / " + nf(stat.median, 0) + " / " + nf(stat.max, 0)) + "</span></div>"
      + (stat.percentil !== null ? '<div class="kv"><span>Seneste pris ligger på</span><span>' + esc(pct(stat.percentil)) + "-percentilen</span></div>" : "")
      + '<p class="small muted">Grundlag: ' + esc(stat.niveau === "fuld" ? "fuldt (tæller ±20 point)" : stat.niveau === "forelobig" ? "foreløbigt (tæller kun ±10 point)" : "for tyndt — percentilen tæller ikke med endnu") + ".</p>";
  }
  h += "</div>";

  h += '<div class="card"><h2>Terminspriser</h2>'
    + '<p class="small muted">Hvad tilbyder din grovvare for levering <em>senere</em>? Det er dét, der afgør om markedet betaler dig for at lagre.</p>';
  const terminer = S.terminer.slice().sort((a, b) => (a.kontraktmaaned < b.kontraktmaaned ? -1 : 1));
  if (terminer.length) {
    h += '<div class="tw"><table><thead><tr><th>Levering</th><th>Type</th><th class="num">Pris</th><th class="num">kr/hkg</th><th></th></tr></thead><tbody>'
      + terminer.map(t => {
        const udl = t.kontraktmaaned < idag.slice(0, 7);
        return "<tr" + (udl ? ' class="muted"' : "") + "><td>" + esc(t.kontraktmaaned) + (udl ? " (udløbet)" : "") + "</td>"
          + "<td>" + esc(t.afgrode === "raps" ? "raps" : "hvede") + ", " + esc(t.type === "matif" ? "MATIF" : "grovvare") + "</td>"
          + '<td class="num">' + esc(nf(t.vaerdi, 2) + " " + (t.enhed === "EUR_t" ? "EUR/t" : t.enhed === "kr_t" ? "kr/t" : "kr/hkg")) + "</td>"
          + '<td class="num">' + esc(nf(terminKrHkg(t, S.parametre), 2)) + "</td>"
          + '<td class="num"><button class="slim" data-act="delTermin" data-id="' + esc(t.id) + '">✕</button></td></tr>';
      }).join("") + "</tbody></table></div>";
  } else h += '<p class="small">Ingen terminspriser indtastet endnu.</p>';
  h += '<div class="btnrow"><button data-act="nyTermin">+ Tilføj terminspris</button></div></div>';

  const log = S.prislog.slice().sort((a, b) => (a.dato < b.dato ? 1 : -1)).slice(0, 40);
  h += '<div class="card"><h2>Prislog</h2>';
  if (log.length) {
    h += '<div class="tw"><table><thead><tr><th>Dato</th><th>Vare</th><th class="num">kr/hkg</th><th></th></tr></thead><tbody>'
      + log.map(o => "<tr><td>" + esc(DK_DATO(o.dato)) + "</td><td>"
        + esc((o.afgrode === "raps" ? "Raps" : o.kvalitet === "broed" ? "Brødhvede" : "Foderhvede")
          + ((o.leveringsperiode || "spot") === "ny_hoest" ? " (ny høst)" : "") + (o.kilde ? " · " + o.kilde : ""))
        + '</td><td class="num">' + esc(nf(o.pris_kr_hkg, 2)) + "</td>"
        + '<td class="num"><button class="slim" data-act="delPris" data-id="' + esc(o.id) + '">✕</button></td></tr>').join("")
      + "</tbody></table></div>";
  } else h += '<p class="small">Ingen priser endnu. En pris om måneden er nok til at komme i gang.</p>';
  h += '<div class="btnrow"><button data-act="bootstrap">Tast gamle priser ind</button></div></div>';
  return h;
}

/* ---------------------------------------------------------- Plan-fanen */
function renderPlan() {
  const idag = todayISO();
  let h = "";
  if (!S.partier.length) h += '<div class="card"><p>Du har ingen partier endnu.</p><div class="btnrow"><button class="primary" data-act="nytparti">+ Opret parti</button></div></div>';
  S.partier.slice().sort((a, b) => (a.hoestaar - b.hoestaar) || (a.afgrode < b.afgrode ? -1 : 1)).forEach(p => {
    const be = beregnBE(p, S.parametre);
    const plan = planStatus(p, S.parametre, idag, be);
    const total = plan.total;
    h += '<div class="card"><h2>' + esc(partiNavn(p)) + (p.lukket ? " (lukket)" : "") + "</h2>";
    h += '<div class="kv"><span>Mængde</span><span>' + esc(hkg(total)) + (fin(p.hoestet_maengde_hkg) !== null ? " (høstet)" : " (forventet)") + "</span></div>";
    h += '<div class="kv"><span>Solgt</span><span>' + esc(hkg(plan.salgSum)) + " · " + esc(pct(plan.solgtPct)) + "</span></div>";
    h += '<div class="kv"><span>Planen siger nu</span><span>' + esc(pct(plan.planPctNu)) + "</span></div>";
    h += '<div class="planbar"><div class="solgt" style="width:' + clamp(plan.solgtPct, 0, 100) + '%"></div>'
      + '<div class="maal" style="left:' + clamp(plan.planPctNu, 0, 100) + '%"></div>'
      + '<div class="txt">' + esc(pct(plan.solgtPct) + " solgt") + "</div></div>";
    h += '<p class="small ' + (plan.status === "BAGUD" ? "" : "muted") + '">' + esc(
      plan.status === "PÅ PLAN" ? nf(Math.abs(plan.afvigelse), 0) + " procentpoint " + (plan.afvigelse < 0 ? "under" : "over") + " plan — stadig på plan."
        : plan.status === "BAGUD" ? "Du er " + nf(Math.abs(plan.afvigelse), 0) + " procentpoint bagud for planen."
          : "Du er " + nf(plan.afvigelse, 0) + " procentpoint forud for planen.") + "</p>";
    if (plan.rulletRest > 0) h += '<p class="small">Rest fra tidligere trancher: <strong>' + esc(hkg(plan.rulletRest)) + "</strong> — den forsvinder ikke, den lægges til næste tranche.</p>";
    if (plan.rulledeTrancher.length) h += '<p class="small muted">' + esc(plan.rulledeTrancher.join(", ")) + " udløb uden at prisen nåede dit krav — andelen er rullet videre.</p>";
    if (isISO(p.haard_deadline)) h += '<div class="kv"><span>Hård frist</span><span>' + esc(DK_DATO(p.haard_deadline)) + " (" + daysBetween(idag, p.haard_deadline) + " dage)</span></div>";

    h += '<div class="tw"><table style="margin-top:10px"><thead><tr><th>Tranche</th><th>Vindue</th><th class="num">Andel</th><th class="num">Solgt</th></tr></thead><tbody>'
      + plan.tr.map(t => "<tr" + (t.aktiv ? ' style="font-weight:600"' : "") + "><td>" + esc(t.id)
        + (t.haard ? " ⛔" : "") + (t.sprunget ? " (sprunget)" : t.indfriet ? " ✓" : "") + "</td>"
        + "<td>" + esc(DK_DATO(t.aabner).slice(0, 5) + "–" + DK_DATO(t.deadline).slice(0, 5)) + "</td>"
        + '<td class="num">' + esc(t.sprunget ? "rullet" : pct(t.andel_eff === undefined ? t.andel : t.andel_eff)) + "</td>"
        + '<td class="num">' + esc(nf(t.solgt_hkg, 0) + " / " + nf(t.maal_hkg, 0)) + "</td></tr>").join("")
      + "</tbody></table></div>";
    const t3 = plan.tr.find(t => t.fysisk_tvunget);
    if (t3) h += '<p class="small">Du høster ' + esc(hkg(p.hoestet_maengde_hkg)) + " og har plads til " + esc(hkg(S.bedrift.egen_lagerkapacitet_hkg))
      + " — mindst " + esc(hkg(t3.fysisk_tvunget)) + " skal direkte fra marken uanset pris. Det er ikke en markedsbeslutning.</p>";

    const salg = S.salg.filter(s => s.parti_id === p.id).sort((a, b) => (a.dato < b.dato ? 1 : -1));
    if (salg.length) {
      const vp = vaegtetKontraktpris(salg);
      h += "<h3>Registrerede salg</h3>"
        + '<div class="tw"><table><thead><tr><th>Dato</th><th class="num">hkg</th><th class="num">kr/hkg</th><th>Type</th><th></th></tr></thead><tbody>'
        + salg.map(s => "<tr><td>" + esc(DK_DATO(s.dato)) + '</td><td class="num">' + esc(hkg(s.maengde_hkg)) + "</td>"
          + '<td class="num">' + esc((s.pris_status || "fast") === "fast" ? nf(s.pris_kr_hkg, 2) : "pulje") + "</td>"
          + "<td>" + esc(s.kontrakttype || "–") + "</td>"
          + '<td class="num"><button class="slim" data-act="delSalg" data-id="' + esc(s.id) + '">✕</button></td></tr>').join("")
        + "</tbody></table></div>"
        + (vp !== null ? '<div class="kv"><span>Vægtet snitpris (kun faste)</span><span>' + esc(krhkg(vp)) + "</span></div>" : "");
    }
    h += '<div class="btnrow"><button class="primary" data-act="salg" data-id="' + esc(p.id) + '">Registrér salg</button>'
      + '<button data-act="redigerParti" data-id="' + esc(p.id) + '">Ret partiet</button></div></div>';
  });
  if (S.partier.length) h += '<div class="btnrow"><button data-act="nytparti">+ Nyt parti</button></div>';
  return h;
}
</script>

<script>
"use strict";
/* ------------------------------------------------------- Påmind-fanen */
const SAADAN_VIRKER = [
  "Denne side kan <strong>ikke</strong> vække din telefon. Den har ingen server, og der findes ingen browserfunktion til det.",
  "<strong>Tryk “Læg påmindelser i din kalender”.</strong> Så får du rigtige alarmer fra telefonens kalender — også når siden er lukket, også uden internet.",
  "<strong>Kalenderen kender ikke prisen.</strong> Den kan minde dig om at kigge. Hvad prisen er, skal du selv ind og se — derfor hedder påmindelserne “Tjek …”, ikke “Sælg …”.",
  "Gentag eksporten når din plan ændrer sig. Påmindelserne har samme ID, så din kalender <em>plejer</em> at opdatere dem i stedet for at lave dubletter. Vælger du en anden kalender ved 2. import, eller bruger du Outlook, kan du få dubletter alligevel — vælg altid samme kalender.",
  "Sletter du en påmindelse her, forsvinder den ikke automatisk fra din kalender — slet den også der.",
  "Google Kalender ignorerer ofte importerede alarmer og bruger din egen standardnotifikation.",
  "Læg siden på <strong>hjemmeskærmen</strong>. Det handler om dine <em>data</em>: Safari sletter ellers det gemte efter 7 dage uden besøg. Det giver dig ikke notifikationer."
];

function renderPaamind() {
  const idag = todayISO();
  const valgt = grupperValgt();
  const alle = genererEvents(idag);
  const tael = g => alle.filter(e => e.gruppe === g).length;
  const std = alle.filter(e => (e.pakke || "standard") === "standard" && valgt[e.gruppe]).length;
  const mkt = alle.filter(e => e.pakke === "marked" && valgt[e.gruppe]).length;

  let h = '<div class="card"><h2>Sådan virker påmindelserne</h2><ul class="grunde small">'
    + SAADAN_VIRKER.map(t => "<li>" + t + "</li>").join("") + "</ul></div>";

  h += '<div class="card"><h2>Læg påmindelser i din kalender</h2>'
    + '<p class="small">Standardfilen indeholder <strong>' + std + ' påmindelser</strong>'
    + (mkt ? " · markedsfilen " + mkt : "") + ".</p>"
    + '<div class="btnrow"><button class="primary" data-act="ics" data-v="standard">Hent kalenderfil (' + std + ")</button>"
    + (valgt.marked ? '<button data-act="ics" data-v="marked">Hent markedsdatoer (' + mkt + ")</button>" : "")
    + '</div><div id="icsStatus" class="small muted" style="margin-top:8px"></div>'
    + (S.lastIcsExportAt ? '<p class="small muted">Sidst eksporteret ' + esc(DK_DATO(S.lastIcsExportAt.slice(0, 10))) + ".</p>" : "")
    + "</div>";

  h += '<div class="card"><h2>Hvad skal med?</h2><ul class="list">'
    + KAL_GRUPPER.map(g => '<li><div class="l-main"><div class="l-title">' + esc(g.navn) + '</div>'
      + '<div class="l-meta">' + tael(g.id) + " påmindelser" + (g.pakke === "marked" ? " · egen fil" : "") + "</div></div>"
      + '<div class="l-act"><button class="slim" data-act="gruppe" data-v="' + g.id + '" aria-pressed="' + valgt[g.id] + '">'
      + (valgt[g.id] ? "Til" : "Fra") + "</button></div></li>").join("") + "</ul></div>";

  const naeste = alle.filter(e => valgt[e.gruppe] && (e.pakke || "standard") === "standard")
    .map(e => ({ ev: e, dato: naesteDato(e, idag) }))
    .filter(x => {
      const k = S.paamindelser[x.ev.key] || {};
      return k.status !== "slettet" && !(k.status === "kvitteret" && k.tilDato === x.dato);
    })
    .sort((a, b) => (a.dato < b.dato ? -1 : 1));
  const forfaldne = naeste.filter(x => x.dato < idag);
  const maaned = naeste.filter(x => x.dato >= idag && x.dato.slice(0, 7) === idag.slice(0, 7));
  const senere = naeste.filter(x => x.dato > idag && x.dato.slice(0, 7) !== idag.slice(0, 7) && x.dato <= addDays(idag, 90));
  const blok = (titel, liste) => !liste.length ? "" : '<div class="card"><h2>' + titel + "</h2><ul class='list'>"
    + liste.slice(0, 25).map(x => '<li><div class="l-main"><div class="l-title">' + esc(x.ev.summary) + "</div>"
      + '<div class="l-meta">' + esc(DK_DATO(x.dato)) + " · " + esc((KAL_GRUPPER.find(g => g.id === x.ev.gruppe) || {}).navn || "") + "</div></div>"
      + '<div class="l-act"><button class="slim" data-act="kvitter" data-key="' + esc(x.ev.key) + '" data-dato="' + esc(x.dato) + '">Kvittér</button></div></li>').join("")
    + "</ul></div>";
  h += blok("Forfaldne", forfaldne) + blok("Denne måned", maaned) + blok("Næste 90 dage", senere);

  h += '<div class="card"><h2>Dine egne køberfrister</h2>'
    + '<p class="small muted">Det er de datoer, der har kroner i sig: puljetilmelding, forwardvinduer, leveringsbooking, rabatfrister. Appen kender ikke din grovvares vilkår — det gør du.</p>';
  if (S.koeberfrister.length) {
    h += "<ul class='list'>" + S.koeberfrister.map(f => '<li><div class="l-main"><div class="l-title">' + esc(f.titel) + "</div>"
      + '<div class="l-meta">' + esc(DK_DATO(f.dato)) + (f.gentag === "aarlig" ? " · hvert år" : "") + (f.koeber ? " · " + esc(f.koeber) : "") + "</div></div>"
      + '<div class="l-act"><button class="slim" data-act="delFrist" data-id="' + esc(f.id) + '">✕</button></div></li>').join("") + "</ul>";
  } else h += '<p class="small">Ingen endnu.</p>';
  h += '<div class="btnrow"><button data-act="nyFrist">+ Tilføj frist</button></div></div>';

  h += '<div class="card"><h2>Notifikationer i browseren</h2>'
    + '<p class="small">Denne side kan ikke sende dig beskeder, når den er lukket. Det kræver en app. Kalenderen er kanalen.</p>'
    + '<details data-d="notif"><summary>Avanceret: prøv en notifikation i denne fane</summary>'
    + '<p class="small muted">Virker kun mens fanen er åben, og slet ikke på iPhone uden at siden ligger på hjemmeskærmen.</p>'
    + '<div class="btnrow"><button data-act="testnotif">Test notifikation</button></div></details></div>';
  return h;
}

/* ---------------------------------------------------- Mine tal-fanen */
function renderTal() {
  const idag = todayISO(), P = S.parametre, B = S.bedrift;
  let h = '<div class="card"><h2>Bedriften</h2>'
    + felt("text", "b_navn", "Navn (valgfrit)", B.navn)
    + '<div class="grid2">'
    + vaelg("b_moms", "Momsperiode", B.momsperiode, [["halvaarlig", "Halvårlig"], ["kvartal", "Kvartal"], ["maaned", "Måned"]])
    + vaelg("b_selskab", "Form", B.selskabsform, [["personlig", "Personlig"], ["selskab", "Selskab"]])
    + felt("dec", "b_lager", "Lagerkapacitet (hkg)", B.egen_lagerkapacitet_hkg)
    + vaelg("b_afskrevet", "Er laden afskrevet?", B.lade_afskrevet ? "1" : "0", [["0", "Nej"], ["1", "Ja"]])
    + "</div>"
    + '<details data-d="likviditet"><summary>Likviditet (styrer likviditetsreglen)</summary><div class="grid2">'
    + felt("dec", "b_ramme", "Kassekredit, ramme (kr)", B.kassekredit_ramme)
    + felt("dec", "b_traek", "Aktuelt træk (kr)", B.kassekredit_traek)
    + felt("date", "b_traekdato", "Trækket målt den", B.traek_maalt_dato)
    + felt("dec", "b_behov", "Kendt likviditetsbehov (kr)", B.likviditetsbehov_kr)
    + "</div><p class='small muted'>Reglen slår først til, når trækket er målt inden for 30 dage og overstiger 80 % af rammen.</p></details>"
    + '<div class="hint">Din momsperiode afhænger af din omsætning og kan være ændret — tjek på skat.dk.</div></div>';

  S.partier.forEach(p => {
    const be = beregnBE(p, P);
    h += '<div class="card"><h2>' + esc(partiNavn(p)) + "</h2>";
    h += '<div class="kv"><span>Dit gulv (netto)</span><span>' + esc(krhkg(be.GULV)) + "</span></div>";
    if (be.beSat) {
      h += '<div class="kv"><span>Variabelt (udsæd, gødning, kemi)</span><span>' + esc(krhkg(be.BE_DB)) + "</span></div>"
        + '<div class="kv"><span>Kontant break-even</span><span>' + esc(krhkg(be.BE_kontant)) + "</span></div>"
        + '<div class="kv"><span>Fuldt krav</span><span>' + esc(krhkg(be.BE_fuld_eff)) + "</span></div>";
      if (be.BE_fuld_optimist !== null && be.BE_fuld_optimist !== be.BE_fuld_eff)
        h += '<p class="small muted">Interval: ' + esc(krhkg(be.BE_fuld_optimist, 0)) + " ved fuldt udbytte – " + esc(krhkg(be.BE_fuld_eff, 0)) + " ved " + esc(pct(P.udbytte_sikkerhed * 100)) + " af udbyttet.</p>";
      if (be.merudgift_broed) h += '<p class="small muted">Heraf ' + esc(krhkg(be.merudgift_broed)) + " i ekstra kvælstof til brødkvalitet. Præmien ligger på prissiden, ikke i gulvet.</p>";
    } else h += '<p class="small">Break-even er ikke udfyldt — dit gulv er din egen minimumspris.</p>';
    h += '<div class="btnrow tight"><button class="slim" data-act="redigerParti" data-id="' + esc(p.id) + '">Ret tal</button>'
      + '<button class="slim" data-act="kvalitet" data-id="' + esc(p.id) + '">Kvalitet &amp; lager</button></div></div>';
  });
  h += '<p class="small muted">Fuldt krav ligger typisk 150–210 kr/hkg afhængigt af jordleje, og af om du regner EU-støtten med. Kontant break-even ligger typisk 25–30 % lavere. Genberegn hvert kvartal — officielle kalkuler: SEGES Budgetkalkuler / Farmtal Online.</p>';

  h += '<details data-d="parametre"><summary>⚙️ Parametre — lager, kurs, kvalitet</summary><div class="grid2">'
    + felt("dec", "p_r", "Rente på kapitalbinding (% p.a.)", round2(P.r_kredit * 100))
    + felt("dec", "p_svind", "Svind (% pr. måned)", round2(P.svind_pct_md * 100))
    + felt("dec", "p_el", "El til beluftning (kr/hkg/md)", P.el_beluftning)
    + felt("dec", "p_anlaeg", "Lade: anlæg (kr/hkg/år)", P.anlaeg_aar)
    + felt("dec", "p_belaeg", "Belægningsgrad (0–1)", P.belaegningsgrad)
    + felt("dec", "p_leje", "Ekstern lagerleje (kr/hkg/md)", P.lagerleje_ekstern)
    + felt("dec", "p_indud", "Ind-/udlagring, ekstern (kr/hkg)", P.ind_udlagring_kr_hkg)
    + felt("dec", "p_eur", "EUR/DKK", P.EURDKK)
    + felt("dec", "p_praemie", "Brødpræmie (kr/hkg)", P.praemie_broedhvede)
    + felt("dec", "p_merud", "Merudgift brødhvede (kr/ha)", P.merudgift_broedhvede_kr_ha)
    + felt("dec", "p_nedklass", "Omkostning ved nedklassificering (kr/hkg)", P.nedklass_omk)
    + felt("dec", "p_toerre", "Tørresats (kr/hkg pr. 0,5 %-point)", P.toerresats)
    + felt("dec", "p_oliebasis", "Oliebasis (%)", P.oliebasis_pct)
    + felt("dec", "p_oliefaktor", "Oliefaktor (% pr. point)", P.oliefaktor)
    + felt("dec", "p_sikkerhed", "Udbyttesikkerhed (0–1)", P.udbytte_sikkerhed)
    + felt("dec", "p_prehoest", "Maks. forudsolgt før høst (%)", P.maks_prehoest_pct)
    + felt("dec", "p_enkelt", "Maks. pr. handel (%)", P.maks_enkelthandel_pct)
    + felt("dec", "p_afstand", "Mindst antal dage mellem salg", P.min_dage_mellem_trancher)
    + felt("time", "p_tid", "Klokkeslæt for påmindelser", P.notifikationstid)
    + vaelg("p_rytme", "Fast prisrytme", P.prisrytme, [["uge", "Hver uge"], ["14dage", "Hver 14. dag"], ["maaned", "Hver måned"], ["ingen", "Ingen"]])
    + "</div><p class='small muted'>Alle tal er et DK-typisk udgangspunkt til kalibrering — ret dem til dine egne. Basis mod MATIF svinger reelt −10 til −35 kr/hkg.</p></details>";

  h += regnemaskiner();

  h += '<div class="card"><h2>Dine data</h2>'
    + '<p class="small muted">Alt ligger kun i denne browser. Ingen server, ingen konto. Tag en kopi jævnligt.</p>'
    + '<div class="btnrow"><button class="primary" data-act="eksportData">Eksportér (JSON)</button>'
    + '<button data-act="importData">Importér</button>'
    + '<button data-act="print">Print handlingsark</button></div>'
    + '<div class="btnrow"><button data-act="selftest">Kør selvtest</button>'
    + '<button class="danger" data-act="nulstil">Slet alt</button></div>'
    + '<div id="selftestUd" class="small" style="margin-top:10px"></div></div>';
  return h;
}

function regnemaskiner() {
  const P = S.parametre;
  let h = '<details data-d="omregner"><summary>🧮 Omregner: EUR/t ↔ kr/hkg ↔ kr/t</summary><div class="grid3">'
    + felt("dec", "r_eur", "EUR/t", "") + felt("dec", "r_krhkg", "kr/hkg", "") + felt("dec", "r_krt", "kr/t", "")
    + "</div><p class='small muted' id='r_note'>Kurs " + esc(nf(P.EURDKK, 2)) + " kr/EUR. Tommelfinger: 1 EUR/t ≈ " + esc(nf(P.EURDKK / 10, 2)) + " kr/hkg.</p></details>";

  h += '<details data-d="olie"><summary>🟡 Raps: olieafregning</summary><div class="grid2">'
    + felt("dec", "o_basis", "Basispris (kr/hkg)", "") + felt("dec", "o_olie", "Olie i tørstof (%)", "")
    + "</div><div id='o_ud' class='small'></div>"
    + "<p class='small muted'>Afregningsolie = olie i tørstof × 0,91 (vægten er allerede korrigeret til 9 % vand). Olie under basis giver fradrag. Oliebasis " + esc(nf(P.oliebasis_pct, 1)) + " % og faktor " + esc(nf(P.oliefaktor, 2)) + " kan rettes under Parametre — din købers model kan være en anden.</p></details>";

  h += '<details data-d="toerring"><summary>💨 Tørring og svind</summary><div class="grid3">'
    + felt("dec", "t_ind", "Vand ind (%)", "") + felt("dec", "t_ud", "Vand ud (%)", "") + felt("dec", "t_vaegt", "Vægt ind (hkg)", "")
    + "</div><div id='t_ud_res' class='small'></div></details>";

  h += '<details data-d="brodfoder"><summary>🌾 Brødhvede eller foderhvede?</summary><div class="grid2">'
    + felt("dec", "e_foder", "Foderhvedepris (kr/hkg)", "") + felt("dec", "e_praemie", "Brødpræmie (kr/hkg)", P.praemie_broedhvede)
    + felt("dec", "e_faldtal", "Faldtal (sek.)", "") + felt("dec", "e_protein", "Protein (%)", "")
    + "</div><div id='e_ud' class='small'></div>"
    + "<p class='small muted'>Sandsynlighederne er en modelantagelse — ret dem i hovedet, hvis du kender din mølle. Faldtallet vælter oftest partiet: tre regnvejrsdage i moden hvede kan fjerne præmien.</p></details>";

  h += '<details data-d="netto"><summary>📄 Nettopris efter fradrag</summary><div class="grid2">'
    + felt("dec", "n_brutto", "Bud (kr/hkg)", "") + felt("dec", "n_toerring", "Tørring (kr/hkg)", "")
    + felt("dec", "n_rense", "Rensning (kr/hkg)", "") + felt("dec", "n_fragt", "Fragt (kr/hkg)", "")
    + felt("dec", "n_analyse", "Analyse m.m. (kr/hkg)", "") + felt("dec", "n_maengde", "Mængde (hkg)", "")
    + "</div><div id='n_ud' class='small'></div></details>";
  return h;
}

function felt(type, id, label, v) {
  const val = v === null || v === undefined ? "" : v;
  if (type === "date") return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><input type="date" id="' + id + '" value="' + esc(val) + '"></div>';
  if (type === "time") return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><input type="time" id="' + id + '" value="' + esc(val) + '"></div>';
  const inp = type === "dec" ? 'inputmode="decimal"' : "";
  return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><input type="text" ' + inp + ' autocomplete="off" id="' + id + '" value="' + esc(typeof val === "number" ? nf(val, val % 1 ? 2 : 0) : val) + '"></div>';
}
function vaelg(id, label, v, opts) {
  return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><select id="' + id + '">'
    + opts.map(([k, t]) => '<option value="' + esc(k) + '"' + (String(v) === String(k) ? " selected" : "") + ">" + esc(t) + "</option>").join("")
    + "</select></div>";
}
</script>

<script>
"use strict";
/* -------------------------------------------------------- onboarding */
function renderOnboarding() {
  const trin = S.ui.onbTrin || 0;
  const aar = new Date().getFullYear();
  const idag = todayISO();
  if (trin === 0) {
    return '<div class="card"><h2>Kom i gang på et minut</h2>'
      + '<p>Tre spørgsmål, så regner jeg. Du kan altid rette bagefter.</p>'
      + '<fieldset><legend>1. Hvad har du?</legend>'
      + '<div class="field"><label><input type="checkbox" id="onb_broed" checked style="width:auto;min-height:0"> Brødhvede</label></div>'
      + '<div class="field"><label><input type="checkbox" id="onb_foder" style="width:auto;min-height:0"> Foderhvede</label></div>'
      + '<div class="field"><label><input type="checkbox" id="onb_raps" checked style="width:auto;min-height:0"> Raps</label></div>'
      + vaelg("onb_aar", "Høstår", aar, [[aar - 1, aar - 1], [aar, aar], [aar + 1, aar + 1]])
      + "</fieldset>"
      + '<fieldset><legend>2. Hvor mange tons — og 3. hvad skal du mindst have?</legend>'
      + '<div class="grid2">'
      + felt("dec", "onb_broed_t", "Brødhvede, tons", "") + felt("dec", "onb_broed_min", "Minimum kr/hkg", "")
      + felt("dec", "onb_foder_t", "Foderhvede, tons", "") + felt("dec", "onb_foder_min", "Minimum kr/hkg", "")
      + felt("dec", "onb_raps_t", "Raps, tons", "") + felt("dec", "onb_raps_min", "Minimum kr/hkg", "")
      + "</div><p class='small muted'>1 ton = 10 hkg. Minimumsprisen er dit gulv: under den anbefaler jeg aldrig salg.</p></fieldset>"
      + '<div class="btnrow"><button class="primary" data-act="onb0">Videre</button>'
      + '<button data-act="onbSkip">Spring over</button></div></div>';
  }
  if (trin === 1) {
    return '<div class="card"><h2>Har du allerede solgt noget af årets høst?</h2>'
      + '<p class="small muted">Uden det tror jeg, du har solgt 0 %, og så råber jeg SÆLG på et forkert grundlag. Datoen er sat til starten af salgsvinduet — ret den, hvis du kan huske hvornår.</p>'
      + S.partier.map(p => '<fieldset><legend>' + esc(partiNavn(p)) + "</legend><div class='grid3'>"
        + felt("date", "onbs_dato_" + p.id, "Hvornår (ret den gerne)", vindueStart(p))
        + felt("dec", "onbs_hkg_" + p.id, "hkg solgt", "")
        + felt("dec", "onbs_pris_" + p.id, "kr/hkg", "")
        + "</div></fieldset>").join("")
      + '<div class="btnrow"><button class="primary" data-act="onb1">Gem</button>'
      + '<button data-act="onb1nej">Nej, intet solgt endnu</button></div></div>';
  }
  return '<div class="card"><h2>Sidste trin: få påmindelserne ud i kalenderen</h2>'
    + '<p>Siden kan ikke vække din telefon. Din kalender kan. Hent filen og åbn den — så ligger alle dine salgsvinduer og frister som rigtige alarmer.</p>'
    + '<div class="btnrow"><button class="primary" data-act="fane" data-v="paamind">Hent kalenderfil</button>'
    + '<button data-act="onb2">Senere</button></div></div>';
}

/* ------------------------------------------------------------ dialoger */
function aabnDlg(html) {
  $("dlgBody").innerHTML = html;
  const d = $("dlg");
  if (!d.open) d.showModal();
  bindDlg();
}
const lukDlg = () => { const d = $("dlg"); if (d.open) d.close(); };

function dlgSalg(id) {
  const p = S.partier.find(x => x.id === id); if (!p) return;
  const idag = todayISO();
  const v = vurderParti(p, idag);
  aabnDlg("<h2>Registrér salg — " + esc(partiNavn(p)) + "</h2>"
    + '<div class="grid2">'
    + felt("date", "s_dato", "Handelsdato", idag)
    + felt("dec", "s_hkg", "Mængde (hkg)", v.maengde_hkg || "")
    + felt("dec", "s_pris", "Pris (kr/hkg brutto)", v.brutto_spot || "")
    + felt("date", "s_lev", "Leveringsdato (styrer skatteåret)", "")
    + vaelg("s_type", "Kontrakttype", "spot", [["spot", "Spot / dagspris"], ["termin", "Terminskontrakt"], ["pulje", "Pulje"], ["minpris", "Minimumspris"], ["futures", "Futures"]])
    + vaelg("s_status", "Prisstatus", "fast", [["fast", "Fast pris"], ["pulje_under_afregning", "Pulje — pris kendes ikke endnu"], ["minimumspris", "Minimumspris"]])
    + felt("text", "s_koeber", "Køber", "")
    + felt("dec", "s_praemie", "Præmie betalt for minpris (kr/hkg)", "")
    + "</div>"
    + '<div class="field"><label for="s_note">Note</label><textarea id="s_note"></textarea></div>'
    + '<div class="banner small">Et pulje-salg tæller med i hvor meget du har solgt, men ikke i din snitpris, før prisen er kendt.</div>'
    + '<div class="btnrow"><button class="primary" data-act="gemSalg" data-id="' + esc(p.id) + '">Gem salget</button>'
    + '<button data-act="luk">Annullér</button></div>');
}

function dlgParti(id) {
  const ny = !id;
  const aar = new Date().getFullYear();
  const p = ny ? defaultParti("hvede", aar) : S.partier.find(x => x.id === id);
  if (!p) return;
  const b = p.be || {};
  aabnDlg("<h2>" + (ny ? "Nyt parti" : "Ret " + esc(partiNavn(p))) + "</h2>"
    + '<div class="grid2">'
    + vaelg("pa_afgrode", "Afgrøde", p.afgrode, [["hvede", "Hvede"], ["raps", "Raps"]])
    + vaelg("pa_klasse", "Kvalitetsklasse", p.kvalitetsklasse || "foder", [["broed", "Brødhvede"], ["foder", "Foderhvede"]])
    + felt("dec", "pa_aar", "Høstår", p.hoestaar)
    + felt("dec", "pa_ha", "Areal (ha)", p.areal_ha)
    + felt("dec", "pa_udb", "Forventet udbytte (hkg/ha)", p.forventet_udbytte_hkg_ha)
    + felt("dec", "pa_forv", "Forventet mængde (hkg)", p.maengde_hkg_forventet)
    + felt("dec", "pa_hoestet", "Faktisk høstet (hkg)", p.hoestet_maengde_hkg)
    + felt("dec", "pa_lagerbeh", "På lager nu (hkg)", p.lagerbeholdning_hkg)
    + felt("dec", "pa_min", "Minimumspris (kr/hkg netto)", p.minimumspris_kr_hkg)
    + felt("dec", "pa_maal", "Målpris (kr/hkg netto)", p.maalpris_kr_hkg)
    + felt("dec", "pa_fradrag", "Typiske fradrag (kr/hkg)", p.typiske_fradrag_kr_hkg)
    + felt("date", "pa_deadline", "Hård frist — lageret skal være tomt", p.haard_deadline)
    + vaelg("pa_lagerform", "Lagerform", p.lagerform, [["egen", "Egen lade"], ["ekstern", "Ekstern lagerleje"], ["ingen", "Leveres direkte"]])
    + "</div>"
    + '<p class="small muted">Fylder du både areal og udbytte ud, regnes forventet mængde automatisk. Fradragene bør komme fra din seneste afregning — hele motoren regner netto.</p>'
    + '<details open><summary>Dit priskrav (break-even)</summary>'
    + vaelg("pa_bemode", "Sådan vil jeg indtaste", p.be_input_mode, [["kr_hkg", "Jeg kender mit krav i kr/hkg"], ["kr_ha", "Regn det ud af mine kr/ha"]])
    + '<div class="grid2">'
    + felt("dec", "be_db_kr_hkg", "Variable omk. (kr/hkg)", b.be_db_kr_hkg)
    + felt("dec", "be_kontant_kr_hkg", "Kontant break-even (kr/hkg)", b.be_kontant_kr_hkg)
    + felt("dec", "be_fuld_kr_hkg", "Fuldt krav (kr/hkg)", b.be_fuld_kr_hkg)
    + "</div>"
    + '<details><summary>… eller regn det ud af kr/ha</summary><div class="grid2">'
    + felt("dec", "be_stykomk", "Udsæd, gødning, kemi (kr/ha)", b.stykomk)
    + felt("dec", "be_maskin", "Maskinomkostninger (kr/ha)", b.maskin)
    + felt("dec", "be_arbejde", "Arbejde (kr/ha)", b.arbejde)
    + felt("dec", "be_kapacitet", "Kapacitetsomk. (kr/ha)", b.kapacitet)
    + felt("dec", "be_forpagtning", "Forpagtning/jordleje (kr/ha)", b.forpagtning)
    + felt("dec", "be_renter", "Renter (kr/ha)", b.renter)
    + felt("dec", "be_afskrivning", "Afskrivning (kr/ha)", b.afskrivning)
    + felt("dec", "be_egen_loen", "Egen løn (kr/ha)", b.egen_loen)
    + felt("dec", "be_egenkapital", "Forrentning af egenkapital (kr/ha)", b.egenkapital)
    + felt("dec", "be_eu_stoette", "EU-støtte (kr/ha)", b.eu_stoette)
    + "</div>"
    + vaelg("pa_stoette", "Regn EU-støtten med?", p.medregn_eu_stoette ? "1" : "0", [["0", "Nej (forsigtigt)"], ["1", "Ja"]])
    + "<p class='small muted'>Regner du støtten med, falder dit kornkrav mærkbart. Du får den først i december.</p></details></details>"
    + '<div class="btnrow"><button class="primary" data-act="gemParti" data-id="' + esc(ny ? "" : p.id) + '">Gem</button>'
    + (ny ? "" : '<button class="danger" data-act="sletParti" data-id="' + esc(p.id) + '">Slet parti</button>')
    + '<button data-act="luk">Annullér</button></div>');
}

function dlgKvalitet(id) {
  const p = S.partier.find(x => x.id === id); if (!p) return;
  const k = p.kvalitet || {}, kr_ = p.kvalitetskrav || {};
  aabnDlg("<h2>Kvalitet og lager — " + esc(partiNavn(p)) + "</h2>"
    + '<p class="small muted">Målingerne styrer lageralarmen. En måling over 30 dage gammel udløser ingen alarm — kun en opgave om at måle igen.</p>'
    + '<div class="grid2">'
    + felt("date", "k_dato", "Målt den", k.maalt_dato || todayISO())
    + felt("dec", "k_vand", "Vandprocent (%)", k.vand_pct)
    + felt("dec", "k_temp", "Korntemperatur (°C)", k.korntemp_c)
    + felt("dec", "k_ude", "Udeluft, 7 døgns middel (°C)", k.udeluft_7dogn_c)
    + (p.afgrode === "hvede" ? felt("dec", "k_protein", "Protein (%)", k.protein_pct)
      + felt("dec", "k_faldtal", "Faldtal (sek.)", k.faldtal_sek)
      + felt("dec", "k_hl", "Hektolitervægt (kg/hl)", k.hl_vaegt_kg)
      + felt("dec", "k_don", "DON (ppm)", k.DON_ppm)
      : felt("dec", "k_olie", "Olie i tørstof (%)", k.olie_pct_toerstof)
      + felt("dec", "k_ffa", "Frie fedtsyrer (%)", k.FFA_pct))
    + felt("dec", "k_renhed", "Renhed (%)", k.renhed_pct)
    + "</div>"
    + "<h3>Kravene i din kontrakt</h3>"
    + '<div class="grid2">'
    + felt("dec", "kk_vand", "Maks. vand (%)", kr_.vand_maks)
    + (p.afgrode === "hvede" ? felt("dec", "kk_protein", "Min. protein (%)", kr_.protein_min)
      + felt("dec", "kk_faldtal", "Min. faldtal (sek.)", kr_.faldtal_min)
      + felt("dec", "kk_hl", "Min. hl-vægt (kg/hl)", kr_.hl_min) : "")
    + "</div>"
    + '<p class="small muted">Kravene her er branchestandard, ikke din aftale. Mange danske møllekontrakter ligger på 10,5–11,0 % protein og 220–250 sekunder — ret dem efter din kontrakt.</p>'
    + '<div class="btnrow"><button class="primary" data-act="gemKvalitet" data-id="' + esc(p.id) + '">Gem</button>'
    + '<button data-act="luk">Annullér</button></div>');
}

function dlgFrist() {
  aabnDlg("<h2>Ny køberfrist</h2>"
    + felt("text", "f_titel", "Hvad er det?", "")
    + '<div class="grid2">'
    + felt("date", "f_dato", "Dato", todayISO())
    + vaelg("f_gentag", "Gentages", "aarlig", [["aarlig", "Hvert år"], ["engang", "Kun denne gang"]])
    + felt("text", "f_koeber", "Køber", "")
    + felt("text", "f_tlf", "Telefon", "")
    + "</div>"
    + '<div class="field"><label for="f_note">Note</label><textarea id="f_note"></textarea></div>'
    + '<p class="small muted">Fx: puljetilmelding, forwardvindue lukker, høstleveringsbooking, rabat ved tilmelding inden en dato.</p>'
    + '<div class="btnrow"><button class="primary" data-act="gemFrist">Gem</button><button data-act="luk">Annullér</button></div>');
}

function dlgTermin() {
  const idag = todayISO();
  const maaneder = [];
  for (let i = 0; i < 18; i++) { const d = addMonths(idag, i); maaneder.push([d.slice(0, 7), d.slice(0, 7)]); }

  else h += '<div class="kv"><span>Markedet betaler</span><span>' + esc(krhkg(v.carry.carry_pr_md)) + "/md</span></div>"
    + '<div class="kv"><span>Det koster dig</span><span>' + esc(krhkg(v.L.L_md)) + "/md</span></div>"
    + '<div class="kv"><span>Netto ved at vente</span><span>' + esc(krhkg(v.carry.carry_net)) + "</span></div>"
    + '<p class="small muted">Beregnet ' + esc(v.carry.form === "matif" ? "MATIF mod MATIF" : "din grovvares forwardpris mod dagsprisen") + " over " + esc(nf(v.carry.n, 1)) + " måneder.</p>";
  h += "<h3>Score</h3><ul class='grunde small'>"
    + Object.entries(v.komponenter).map(([k, val]) => "<li>" + esc(({ be: "Din pris mod dit krav", percentil: "Hvor prisen ligger mod de seneste måneder", carry: "Betaler markedet for lagring", plan: "Din plan", saeson: "Årstid", risiko: "Risiko" })[k] || k) + ": " + (val > 0 ? "+" : "") + val + "</li>").join("")
    + "</ul><p class='small'>50 + summen = " + v.score + ".</p>";
  if (v.signaler.length) h += "<h3>Signaler</h3><ul class='grunde small'>" + v.signaler.map(s => "<li>" + esc(s.txt) + "</li>").join("") + "</ul>";

<script>
"use strict";
/* ------------------------------------------------------- handlinger */
let prisEnhed = "kr_hkg";

function prisIKrHkg(raw) {
  const v = num(raw); if (v === null) return null;
  if (prisEnhed === "kr_t") return round2(v / 10);
  if (prisEnhed === "EUR_t") return round2(v * S.parametre.EURDKK / 10);
  return round2(v);
}
function opdaterPrisHint() {
  const el = $("prisInput"), ud = $("prisOmregn"); if (!el || !ud) return;
  const v = prisIKrHkg(el.value);
  if (v === null) { ud.textContent = "Indtast prisen i " + (prisEnhed === "kr_t" ? "kr/t" : prisEnhed === "EUR_t" ? "EUR/t" : "kr/hkg") + "."; return; }
  ud.textContent = nf(v, 2) + " kr/hkg  ·  " + nf(v * 10, 0) + " kr/t  ·  " + nf(krHkgTilEur(v, S.parametre.EURDKK), 2) + " EUR/t";
}
function gemPris() {
  const el = $("prisInput"); if (!el) return;
  const v = prisIKrHkg(el.value);
  const ps = S.ui.prisSidst;
  if (v === null) { visBanner("warn", "Skriv et tal først."); return; }
  const baand = PRIS_BAAND[ps.afgrode];
  if (v < baand[0] || v > baand[1]) {
    visBanner("bad", "Er det rigtigt? " + nf(v, 2) + " kr/hkg ligger uden for det mulige for "
      + ps.afgrode + " (" + baand[0] + "–" + baand[1] + " kr/hkg). Tjek enheden — EUR/t og kr/hkg forveksles let.");
    return;
  }
  const sidste = S.prislog.filter(o => o.afgrode === ps.afgrode && o.kvalitet === (ps.afgrode === "raps" ? "raps" : ps.kvalitet))
    .sort((a, b) => (a.dato < b.dato ? -1 : 1)).pop();
  if (sidste && Math.abs(v - sidste.pris_kr_hkg) / sidste.pris_kr_hkg > 0.15)
    visBanner("warn", "Bemærk: det er over 15 % fra din seneste pris på " + nf(sidste.pris_kr_hkg, 2) + " kr/hkg. Den er gemt — ret den, hvis det var en slåfejl.");
  const dato = ($("prisDato") && $("prisDato").value) || todayISO();
  const kilde = ($("prisKilde") && $("prisKilde").value) || "";
  mutate(s => {
    s.prislog.push({ id: nyId("o"), dato, afgrode: ps.afgrode,
      kvalitet: ps.afgrode === "raps" ? "raps" : ps.kvalitet,
      leveringsperiode: ps.leveringsperiode || "spot", pris_kr_hkg: v, kilde, note: "" });
    s.ui.prisSidst.kilde = kilde;
  }, "Pris gemt: " + nf(v, 2) + " kr/hkg");
}

async function hentICS(pakke) {
  const r = eksporterICS(pakke);
  const st = $("icsStatus");
  if (!r.antal) { if (st) st.textContent = "Der er ingen påmindelser at eksportere — vælg mindst én gruppe."; return; }
  if (!r.validering.ok) {
    if (st) st.textContent = "Filen blev ikke leveret: den fejlede den indbyggede kontrol (" + JSON.stringify(r.validering.fejl) + ").";
    return;
  }
  const navn = pakke === "marked" ? "kornsalg-marked.ics" : "kornsalg.ics";
  const res = await leverICS(r.txt, navn);
  mutate(s => { s.lastIcsExportAt = new Date().toISOString(); }, null);
  if (st) st.textContent = res === "cancelled" ? "Afbrudt." : r.antal + " påmindelser lagt i filen " + navn + ". Åbn den og vælg den samme kalender hver gang.";
}
function eksporterData() {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href: url, download: "kornsalg-" + todayISO() + ".json" });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  mutate(s => { s.lastExportAt = new Date().toISOString(); }, null);
}
function importerData() {
  const inp = Object.assign(document.createElement("input"), { type: "file", accept: "application/json,.json" });
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      let d = null;
      try { d = JSON.parse(String(fr.result)); } catch (e) { visBanner("bad", "Filen kunne ikke læses som JSON."); return; }
      if (!d || !Array.isArray(d.partier)) { visBanner("bad", "Filen ligner ikke en Kornsalg-sikkerhedskopi."); return; }
      eksporterData(); // sikkerhedskopi af det nuværende, før vi overskriver
      if (!confirm("Erstat alle dine nuværende tal med indholdet af filen? Der er lige hentet en sikkerhedskopi af det nuværende.")) return;
      S = migrate(d); saveState(); render();
      visBanner("ok", "Data importeret.");
    };
    fr.readAsText(f);
  };
  inp.click();
}

function kopierHandelsbesked(id) {
  const p = S.partier.find(x => x.id === id); if (!p) return;
  const v = vurderParti(p, todayISO());
  const m = v.maengde_hkg || v.rest || 0;
  const txt = nf(m, 0) + " hkg " + partiNavn(p).toLowerCase() + ", levering "
    + (fin(p.lagerbeholdning_hkg) > 0 ? "ab lager" : "efter aftale")
    + (v.limitpris_brutto !== null ? ", min. " + nf(v.limitpris_brutto, 0) + " kr/hkg ab gård" : "") + ".";
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => visBanner("ok", "Kopieret: " + txt), () => visBanner("", txt));
  } else visBanner("", txt);
}

function koerSelvtest() {
  const T = [], ok = (navn, faktisk, forventet, tol) => {
    const bestaaet = typeof forventet === "number"
      ? Math.abs(faktisk - forventet) <= (tol === undefined ? 0.01 : tol)
      : faktisk === forventet;
    T.push({ navn, bestaaet, faktisk, forventet });
  };
  const P = defaultParametre();
  // Dato og tekst
  ok("daysInMonth feb 2028 (skudår)", daysInMonth(2028, 2), 29);
  ok("sidsteDagIFebruar 2028", sidsteDagIFebruar(2028), "2028-02-29");
  ok("lastBusinessDayOfMonth apr 2027", lastBusinessDayOfMonth(2027, 4), "2027-04-30");
  ok("nextBusinessDay lørdag", nextBusinessDay("2027-09-11"), "2027-09-13");
  ok("addMonths over årsskifte", addMonths("2027-12-31", -12), "2026-12-31");
  ok("num med komma", num("182,96"), 182.96);
  ok("esc mod script", esc('<img src=x onerror=alert(1)>'), "&lt;img src=x onerror=alert(1)&gt;");
  ok("icsEscape semikolon+komma+backslash", icsEscape("a;b,c" + BS + "d"), "a" + BS + ";b" + BS + ",c" + BS + BS + "d");
  ok("todayISO er lokal", todayISO(new Date(2027, 0, 1, 0, 30)), "2027-01-01");
  // Tidszone
  ok("zonedToUTC sommer 07:00 → 05:00Z", toUTCStamp(zonedToUTC("2027-07-01", 7, 0)), "20270701T050000Z");
  ok("zonedToUTC vinter 07:00 → 06:00Z", toUTCStamp(zonedToUTC("2027-12-01", 7, 0)), "20271201T060000Z");
  ok("DST-hul 02:30 flyttes til 03:00", dstSikkerTid("2027-03-28", 2, 30).hh, 3);
  // Omregning
  ok("245,25 EUR/t → kr/hkg", eurTilKrHkg(245.25, 7.46), 182.96);
  ok("175 kr/hkg → EUR/t", krHkgTilEur(175, 7.46), 234.58, 0.02);
  // Break-even
  const pBE = Object.assign(defaultParti("hvede", 2027), {
    areal_ha: 82, forventet_udbytte_hkg_ha: 82, hoestet_maengde_hkg: 82 * 82, kvalitetsklasse: "foder",
    be_input_mode: "kr_ha", be: Object.assign(defaultBe(), { stykomk: 5200, maskin: 2100, arbejde: 400,
      kapacitet: 900, forpagtning: 3600, renter: 1100, afskrivning: 1800, egen_loen: 1200, egenkapital: 900, eu_stoette: 2300 })
  });
  const be1 = beregnBE(pBE, P);
  ok("BE_DB", be1.BE_DB, 63.41);
  ok("BE_kontant uden støtte", be1.BE_kontant, 162.20);
  ok("BE_fuld uden støtte", be1.BE_fuld, 209.76);
  const be2 = beregnBE(Object.assign({}, pBE, { medregn_eu_stoette: true }), P);
  ok("BE_fuld med støtte", be2.BE_fuld, 181.71);
  // Lager
  const gemtBedrift = S.bedrift;
  S.bedrift = Object.assign(defaultBedrift(), { lade_afskrevet: false });
  ok("L_md hvede 183 egen lade", lagerOmk(183, { lagerform: "egen" }, P).L_md, 2.49);
  ok("L_md raps 375 ekstern", lagerOmk(375, { lagerform: "ekstern" }, P).L_md, 4.28);
  S.bedrift = Object.assign(defaultBedrift(), { lade_afskrevet: true });
  ok("L_md afskrevet lade", lagerOmk(183, { lagerform: "egen" }, P).L_md, 1.66);
  S.bedrift = gemtBedrift;
  // Tørring og olie
  const tt = toerring(12, 9, 100, P);
  ok("tørresvind 12→9 %", tt.svind_pct, 3.30);
  ok("tørring kr/hkg", tt.kr_hkg, 9.00);
  ok("olie 47 % DLG (1,25)", olieAfregning(373, 47, Object.assign({}, P, { oliefaktor: 1.25 })).pris, 385.92, 0.02);
  ok("olie 47 % MATIF (1,50)", olieAfregning(373, 47, Object.assign({}, P, { oliefaktor: 1.50 })).pris, 388.50, 0.02);
  ok("olie 41 % giver fradrag", olieAfregning(373, 41, Object.assign({}, P, { oliefaktor: 1.25 })).pris < 373, true);
  // Percentil
  const logTest = [150, 160, 165, 170, 175, 180, 185, 190, 183].map((v, i) => ({
    id: "x" + i, dato: addDays("2027-01-01", i * 10), afgrode: "hvede", kvalitet: "foder",
    leveringsperiode: "spot", pris_kr_hkg: v
  }));
  const gemtLog = S.prislog; S.prislog = logTest;
  ok("percentil 183 mod 8 ældre", prisstat(S.prislog, "hvede", "foder", "spot", "2027-06-01").percentil, 75.0);
  S.prislog = gemtLog;
  // Plan
  const pPlan = Object.assign(defaultParti("hvede", 2027), { maengde_hkg_forventet: 6724, haard_deadline: "2028-06-30" });
  const ank = planAnkre(pPlan, P, "2029-01-01", { BE_fuld_eff: null }).ankre; // alle betingelser tælles med (ingen betingede spring når BE mangler)
  const ankreFuld = [["2026-11-01", 0], ["2027-03-31", 10], ["2027-06-15", 25], ["2027-08-31", 45],
    ["2027-11-30", 65], ["2028-02-29", 85], ["2028-06-30", 100]];
  ok("planPct 2027-08-01", planPct(ankreFuld, "2027-08-01"), 37.21);
  ok("planPct 2027-09-18", planPct(ankreFuld, "2027-09-18"), 48.96);
  ok("planPct 2028-04-01 (skudår)", planPct(ankreFuld, "2028-04-01"), 88.93);
  const ankreRaps = [["2027-01-01", 0], ["2027-04-30", 15], ["2027-06-30", 35], ["2027-08-31", 65],
    ["2027-10-31", 85], ["2027-12-31", 100]];
  ok("planPct raps 2027-09-18", planPct(ankreRaps, "2027-09-18"), 70.90);
  ok("planankre slutter på 100", ank[ank.length - 1][1], 100);
  // En sprunget tranche må hverken tælle i planen eller opsuge solgte hkg.
  const gemtLog2 = S.prislog;
  S.prislog = [{ id: "lav", dato: "2027-02-01", afgrode: "hvede", kvalitet: "foder", leveringsperiode: "spot", pris_kr_hkg: 120 }];
  const pRul = Object.assign(defaultParti("hvede", 2027), { maengde_hkg_forventet: 6720,
    kvalitetsklasse: "foder", haard_deadline: "2028-06-30" });
  const planRul = planStatus(pRul, P, "2027-09-18", { BE_fuld_eff: 200, GULV: 200, beSat: true });
  const sprungne = planRul.tr.filter(t => t.sprunget);
  const sumAndel = round2(planRul.tr.reduce((a, t) => a + (t.andel_eff === undefined ? t.andel : t.andel_eff), 0));
  ok("sprungne trancher findes når prisen aldrig nåede kravet", sprungne.length > 0, true);
  ok("sprungne trancher har mål 0 hkg", sprungne.every(t => t.maal_hkg === 0), true);
  ok("andelene summer stadig til 100 %", sumAndel, 100);
  S.prislog = gemtLog2;
  // Beslutningsmotor mod et syntetisk lager
  const gemt = JSON.stringify(S);
  try {
    const idag = "2027-09-18";
    // G0: aldrig SÆLG under eget gulv
    S.partier = [Object.assign(defaultParti("hvede", 2027), { id: "tp1", maengde_hkg_forventet: 6724,
      minimumspris_kr_hkg: 170, typiske_fradrag_kr_hkg: 6, kvalitetsklasse: "foder", salgshistorik_bekraeftet: true })];
    S.prislog = [{ id: "t1", dato: idag, afgrode: "hvede", kvalitet: "foder", leveringsperiode: "spot", pris_kr_hkg: 156 }];
    S.salg = []; S.terminer = []; S.ui.sidsteVerdikt = {};
    const v1 = vurderParti(S.partier[0], idag);
    ok("G0: netto 150 under gulv 170 giver aldrig SÆLG", BAND_RANG[v1.anbefaling] === undefined || BAND_RANG[v1.anbefaling] <= BAND_RANG.VENT, true);
    // H1: fysisk problem får fysisk svar
    S.partier = [Object.assign(defaultParti("raps", 2027), { id: "tp2", maengde_hkg_forventet: 1400,
      hoestet_maengde_hkg: 1400, lagerbeholdning_hkg: 1400, minimumspris_kr_hkg: 300,
      kvalitet: Object.assign(defaultKvalitet(), { vand_pct: 9.8, maalt_dato: idag }) })];
    S.prislog = [{ id: "t2", dato: idag, afgrode: "raps", kvalitet: "raps", leveringsperiode: "spot", pris_kr_hkg: 280 }];
    const v2 = vurderParti(S.partier[0], idag);
    ok("H1: for våd raps giver TØR, ikke SÆLG", v2.anbefaling === "FYSISK" && v2.handling === "TØR", true);
    const gemtPris = S.prislog; S.prislog = [];
    const v2b = vurderParti(S.partier[0], idag);
    ok("H1 gælder også uden pris (korn rådner uanset)", v2b.anbefaling === "FYSISK" && v2b.handling === "TØR", true);
    S.prislog = gemtPris;
    // Gammel måling må ikke udløse alarm
    S.partier[0].kvalitet.maalt_dato = addDays(idag, -60);
    const v3 = vurderParti(S.partier[0], idag);
    ok("H1: måling over 30 dage gammel giver kun en opgave", v3.anbefaling !== "FYSISK", true);
    // H0: gammel pris giver intet verdikt
    S.prislog = [{ id: "t3", dato: addDays(idag, -30), afgrode: "raps", kvalitet: "raps", leveringsperiode: "spot", pris_kr_hkg: 280 }];
    S.partier[0].kvalitet.maalt_dato = null;
    ok("H0: pris over 14 dage gammel giver intet verdikt", vurderParti(S.partier[0], idag).anbefaling, "INGEN_DATA");
    // Førhøstloft
    S.partier = [Object.assign(defaultParti("hvede", 2028), { id: "tp3", maengde_hkg_forventet: 6724,
      minimumspris_kr_hkg: 150, typiske_fradrag_kr_hkg: 6, kvalitetsklasse: "foder", salgshistorik_bekraeftet: true })];
    S.salg = [{ id: "s1", parti_id: "tp3", dato: "2027-12-01", maengde_hkg: 3000, pris_kr_hkg: 190, pris_status: "fast" }];
    S.prislog = [{ id: "t4", dato: idag, afgrode: "hvede", kvalitet: "foder", leveringsperiode: "ny_hoest", pris_kr_hkg: 200 }];
    const v4 = vurderParti(S.partier[0], "2028-01-05");

}

function render() {
  const aabne = new Set([...document.querySelectorAll("#app details[data-d][open]")].map(d => d.dataset.d));
  const scroll = window.scrollY;
  const aktiv = document.activeElement;
  const fokusId = aktiv && aktiv.id ? aktiv.id : null;

  const bs = $("btnStorSkrift"); if (bs) bs.setAttribute("aria-pressed", String(!!S.ui.storSkrift));
  document.querySelectorAll("nav.bottom button").forEach(b =>
    b.setAttribute("aria-current", b.dataset.fane === S.ui.aktivFane ? "page" : "false"));

  const f = S.ui.aktivFane;
  let html = "";
  if (!S.ui.onboardet && f === "handling") html = renderOnboarding();
  else if (f === "handling") html = renderHandling();
  else if (f === "pris") html = renderPris();
  else if (f === "plan") html = renderPlan();
  else if (f === "paamind") html = renderPaamind();
  else html = renderTal();
  $("app").innerHTML = html;
  document.querySelectorAll("#app details[data-d]").forEach(d => { if (aabne.has(d.dataset.d)) d.open = true; });
  renderBannere();
  bannerEkstra = [];

  if (f === "pris") {
    const g = $("graf");
    if (g) {
      const idag = todayISO();
      const p0 = aktivePartier(idag)[0] || S.partier[0];
      const kval = p0 ? partiKvalitet(p0) : (S.ui.prisSidst.afgrode === "raps" ? "raps" : S.ui.prisSidst.kvalitet);
      const afg = p0 ? p0.afgrode : S.ui.prisSidst.afgrode;
      const st = prisstat(S.prislog, afg, kval, p0 ? prisPeriodeForParti(p0, idag) : "spot", idag);
      const be = p0 ? beregnBE(p0, S.parametre) : {};
      const tegn = () => tegnGraf(g, st.serie, { gulv: be.GULV, maal: p0 ? p0.maalpris_kr_hkg : null });
      tegn();
      if (window.ResizeObserver) {
        if (grafObserver) grafObserver.disconnect();
        grafObserver = new ResizeObserver(tegn);
        grafObserver.observe(g);
      }
    }
  }
  opdaterPrisHint();

  if (scroll) window.scrollTo(0, scroll);
  if (fokusId) {
    const el = $(fokusId);
    if (el && el.focus) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selStart); } catch (e) { } }
    }
  }
}
