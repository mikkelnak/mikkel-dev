<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kornsalg – hvornår skal du sælge?</title>
<style>
  :root {
    --bg: #f7f4ec;
    --card: #ffffff;
    --ink: #22201c;
    --muted: #6b6559;
    --line: #e2dbcc;
    --line-strong: #c9c0ac;
    --accent: #7a6414;
    --accent-soft: #fbf3d6;
    --green: #1d6b3a;
    --green-soft: #e4f3e8;
    --green-strong: #0f5128;
    --amber: #9a5b00;
    --amber-soft: #fdf0dd;
    --red: #a32619;
    --red-soft: #fbe6e3;
    --grey-soft: #eeeae1;
    --shadow: 0 1px 2px rgba(34,32,28,.07), 0 4px 14px rgba(34,32,28,.05);
    --r: 14px;
    --tap: 44px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17160f;
      --card: #201e17;
      --ink: #f2eee3;
      --muted: #a9a294;
      --line: #35322a;
      --line-strong: #4a463b;
      --accent: #d8bf5c;
      --accent-soft: #2e2915;
      --green: #6dd08d;
      --green-soft: #17301f;
      --green-strong: #8fe0a9;
      --amber: #f0b45c;
      --amber-soft: #33240f;
      --red: #f2887b;
      --red-soft: #351a16;
      --grey-soft: #2a2721;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  html[data-stor="1"] { font-size: 20px; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
    font-size: 1rem;
    overflow-wrap: break-word;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 12px 14px 112px; }
  h1 { font-size: 1.25rem; margin: 0; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  h3 { font-size: .95rem; margin: 18px 0 8px; }
  p { margin: 0 0 10px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .small { font-size: .82rem; }
  .tiny { font-size: .76rem; }
  .nowrap { white-space: nowrap; }
  .tabnum { font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 6px 0 12px;
  }
  header.top .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  header.top .brand span.logo { font-size: 1.35rem; }
  header.top .sub { color: var(--muted); font-size: .78rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .card.flat { box-shadow: none; }
  .card > :last-child { margin-bottom: 0; }

  /* ---- verdict card ---- */
  .verdict { border-width: 2px; }
  .verdict.v-saelg_nu   { border-color: var(--green);  background: var(--green-soft); }
  .verdict.v-saelg      { border-color: var(--green);  background: var(--card); }
  .verdict.v-vent       { border-color: var(--line-strong); background: var(--card); }
  .verdict.v-saelg_ikke { border-color: var(--amber);  background: var(--amber-soft); }
  .verdict.v-fysisk     { border-color: var(--red);    background: var(--red-soft); }
  .verdict.v-info       { border-color: var(--line-strong); background: var(--grey-soft); }
  .verdict .ord {
    font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em;
    line-height: 1.1; margin: 2px 0 4px;
  }
  .verdict.v-saelg_nu .ord, .verdict.v-saelg .ord { color: var(--green-strong); }
  .verdict.v-saelg_ikke .ord { color: var(--amber); }
  .verdict.v-fysisk .ord { color: var(--red); }
  .verdict .kroner { font-size: 1.35rem; font-weight: 700; margin-bottom: 6px; }
  .verdict .partilabel {
    display: inline-block; font-size: .78rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
  }
  ul.grunde { margin: 10px 0; padding-left: 18px; }
  ul.grunde li { margin-bottom: 5px; }
  .saeson-note { font-size: .82rem; color: var(--muted); margin: 6px 0 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
  .chip {
    font-size: .74rem; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line-strong); background: var(--card); color: var(--muted);
    white-space: nowrap;
  }
  .chip.pos { border-color: var(--green); color: var(--green-strong); background: var(--green-soft); }
  .chip.neg { border-color: var(--amber); color: var(--amber); background: var(--amber-soft); }

  .scorebar { height: 10px; border-radius: 999px; background: var(--grey-soft); overflow: hidden; margin: 10px 0 4px; }
  .scorebar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .scorebar.svag { opacity: .45; }

  /* ---- plan bar ---- */
  .planbar { position: relative; height: 26px; border-radius: 8px; background: var(--grey-soft); overflow: hidden; margin: 8px 0 6px; }
  .planbar > .solgt { position: absolute; inset: 0 auto 0 0; background: var(--green); opacity: .8; }
  .planbar > .maal { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--ink); }
  .planbar > .txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: .78rem; font-weight: 700; color: var(--ink); mix-blend-mode: normal; }

  /* ---- buttons ---- */
  button, .btn {
    font: inherit; font-weight: 600; cursor: pointer;
    min-height: var(--tap); padding: 10px 14px;
    border-radius: 10px; border: 1px solid var(--line-strong);
    background: var(--card); color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #10240f; } }
  button.ghost { background: transparent; border-style: dashed; color: var(--accent); }
  button.danger { color: var(--red); border-color: var(--red); background: transparent; }
  button.slim { min-height: 36px; padding: 6px 10px; font-size: .84rem; }
  button.link { min-height: 0; padding: 0; border: none; background: none; color: var(--accent); text-decoration: underline; font-weight: 600; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btnrow > button { flex: 1 1 auto; }
  .btnrow.tight > button { flex: 0 1 auto; }

  /* ---- forms ---- */
  label { font-weight: 600; font-size: .88rem; display: block; margin-bottom: 4px; }
  input[type="text"], input[type="date"], input[type="time"], select, textarea {
    font: inherit; width: 100%; min-height: var(--tap);
    padding: 9px 10px; border: 1px solid var(--line-strong); border-radius: 10px;
    background: var(--card); color: var(--ink);
  }
  textarea { min-height: 70px; }
  .field { margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
  .hint { font-size: .78rem; color: var(--muted); margin-top: 3px; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 0 0 12px; }
  legend { font-weight: 700; font-size: .85rem; padding: 0 4px; }

  .seg { display: flex; gap: 6px; }
  .seg > button {
    flex: 1; border-radius: 10px; font-weight: 700;
    background: var(--card); border: 2px solid var(--line-strong); color: var(--muted);
  }
  .seg > button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }

  .stepper { display: flex; gap: 6px; align-items: stretch; }
  .stepper input { text-align: center; font-size: 1.5rem; font-weight: 700; }
  .stepper button { min-width: 48px; font-size: 1.1rem; font-weight: 700; }

  details { border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; margin-bottom: 12px; background: var(--card); }
  details[open] { padding-bottom: 12px; }
  summary { cursor: pointer; font-weight: 700; padding: 12px 0; min-height: var(--tap); display: flex; align-items: center; }
  summary::marker { color: var(--muted); }

  .tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { padding: 7px 5px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .banner {
    border-radius: 10px; padding: 10px 12px; margin-bottom: 12px;
    border: 1px solid var(--line-strong); background: var(--grey-soft); font-size: .88rem;
  }
  .banner.warn { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
  .banner.bad  { border-color: var(--red); background: var(--red-soft); color: var(--red); }
  .banner.ok   { border-color: var(--green); background: var(--green-soft); color: var(--green-strong); }
  .banner strong { color: inherit; }

  .list { list-style: none; margin: 0; padding: 0; }
  .list > li {
    display: flex; gap: 10px; align-items: flex-start; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .list > li:last-child { border-bottom: none; }
  .list .l-main { min-width: 0; flex: 1 1 auto; }
  .list .l-title { font-weight: 600; }
  .list .l-meta { font-size: .78rem; color: var(--muted); }
  .list .l-act { flex: 0 0 auto; display: flex; gap: 6px; align-items: center; }

  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
  .kv > span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }

  nav.bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.bottom button {
    flex: 1; flex-direction: column; gap: 1px; border: none; border-radius: 0;
    background: none; color: var(--muted); font-size: .68rem; font-weight: 700;
    min-height: 56px; padding: 6px 2px;
  }
  nav.bottom button b { font-size: 1.15rem; font-weight: 400; line-height: 1; }
  nav.bottom button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

  dialog {
    border: none; border-radius: 16px; padding: 0; max-width: 560px; width: calc(100% - 24px);
    background: var(--card); color: var(--ink); box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog .dlg-body { padding: 16px; max-height: 78vh; overflow: auto; }
  dialog h2 { margin-top: 0; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 50;
    background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px;
    font-size: .88rem; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow);
    max-width: calc(100% - 24px);
  }
  .toast button { min-height: 32px; padding: 4px 10px; background: transparent; border-color: var(--bg); color: var(--bg); }

  .footnote { color: var(--muted); font-size: .76rem; text-align: center; margin: 18px 0 0; }
  .graf-wrap { width: 100%; }
  .graf-akse { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-top: 2px; }

  @media print {
    nav.bottom, .noprint, button { display: none !important; }
    body { background: #fff; color: #000; }
    .card { break-inside: avoid; box-shadow: none; border-color: #999; }
    .wrap { padding: 0; max-width: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top noprint">
    <div class="brand">
      <span class="logo" aria-hidden="true">🌾</span>
      <div>
        <h1>Kornsalg</h1>
        <div class="sub" id="topSub">Brødhvede &amp; raps — hvornår sælger du?</div>
      </div>
    </div>
    <button class="slim" id="btnStorSkrift" aria-pressed="false" title="Større skrift">A+</button>
  </header>

  <div id="bannere"></div>
  <main id="app" aria-live="polite"></main>

  <p class="footnote">
    Beslutningsstøtte — ikke rådgivning. Alle priser indtaster du selv. Siden henter ingen live-data.
    Handler du efter den, er beslutningen din.
  </p>
</div>

<nav class="bottom noprint" id="nav" role="tablist">
  <button data-fane="handling" role="tab"><b>🎯</b>Handling</button>
  <button data-fane="pris" role="tab"><b>💰</b>Pris</button>
  <button data-fane="plan" role="tab"><b>📊</b>Plan</button>
  <button data-fane="paamind" role="tab"><b>🔔</b>Påmind</button>
  <button data-fane="tal" role="tab"><b>⚙️</b>Mine tal</button>
</nav>

<dialog id="dlg"><div class="dlg-body" id="dlgBody"></div></dialog>
<div id="toastHost"></div>

<script>
"use strict";
/* ==========================================================================
   Kornsalg — beslutningsstøtte til brødhvede og raps.
   Én fil, ingen afhængigheder, ingen server, ingen live-data.
   §1 utils  §2 state  §3 beregninger  §4 plan  §5 beslutning
   §6 kalender/ICS  §7 graf  §8 UI  §9 selvtest
   ========================================================================== */

/* ---------------------------------------------------------------- §1 utils */
const p2 = n => String(n).padStart(2, "0");
const fmtISO = (y, m, d) => y + "-" + p2(m) + "-" + p2(d);
const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
// Lokal kalenderdato. toISOString() er UTC og giver forkert dag før kl. 02 dansk.
const todayISO = (d = new Date()) => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
const isISO = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
const dnum = iso => { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const addDays = (iso, n) => { const t = new Date(dnum(iso) + n * 864e5); return fmtISO(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); };
const daysBetween = (a, b) => Math.round((dnum(b) - dnum(a)) / 864e5);
function addMonths(iso, n) {
  const [y, m, d] = iso.split("-").map(Number);
  const tm = m - 1 + n, ty = y + Math.floor(tm / 12), mm = ((tm % 12) + 12) % 12;
  return fmtISO(ty, mm + 1, Math.min(d, daysInMonth(ty, mm + 1)));
}
function nextBusinessDay(iso) {
  let s = iso;
  for (let i = 0; i < 10; i++) {
    const w = new Date(dnum(s)).getUTCDay();
    if (w !== 0 && w !== 6) return s;
    s = addDays(s, 1);
  }
  return s;
}
function lastBusinessDayOfMonth(y, m) {
  let d = daysInMonth(y, m);
  for (let i = 0; i < 6; i++) {
    const w = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    if (w !== 0 && w !== 6) return fmtISO(y, m, d);
    d--;
  }
  return fmtISO(y, m, d);
}
const sidsteDagIFebruar = y => fmtISO(y, 2, daysInMonth(y, 2)); // skudår!

const num = s => {
  if (s === null || s === undefined || s === "") return null;
  const v = parseFloat(String(s).replace(/[\s\u00a0]/g, "").replace(/\.(?=\d{3}\b)/g, "").replace(",", "."));
  return Number.isFinite(v) ? v : null;
};
const fin = v => (typeof v === "number" && Number.isFinite(v) ? v : null);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const round2 = v => (fin(v) === null ? null : Math.round(v * 100) / 100);

const nf = (v, d = 2) => (fin(v) === null ? "–" : v.toLocaleString("da-DK", { minimumFractionDigits: d, maximumFractionDigits: d }));
const kr = (v, d = 0) => (fin(v) === null ? "–" : nf(v, d) + " kr.");
const krhkg = (v, d = 2) => (fin(v) === null ? "–" : nf(v, d) + " kr/hkg");
const hkg = v => (fin(v) === null ? "–" : nf(v, 0) + " hkg");
const pct = (v, d = 0) => (fin(v) === null ? "–" : nf(v, d) + " %");
const DK_DATO = iso => (isISO(iso) ? iso.slice(8, 10) + "/" + iso.slice(5, 7) + "-" + iso.slice(0, 4) : "–");

const esc = s => String(s === null || s === undefined ? "" : s)
  .replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nyId = p => p + "_" + ((self.crypto && self.crypto.randomUUID) ? self.crypto.randomUUID().slice(0, 8)
  : Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
const h32 = s => { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); };

const AFGRODE = {
  hvede: { navn: "hvede", langt: "Brødhvede / hvede", hoeststart: m => fmtISO(m, 8, 1), emoji: "🌾" },
  raps:  { navn: "raps",  langt: "Raps",              hoeststart: m => fmtISO(m, 7, 20), emoji: "🟡" }
};

/* --------------------------------------------------------------- §2 state */
const KEY = "korn.v1", SCHEMA = 2;
let storageOK = true, readOnly = false, raaData = null;
try { localStorage.setItem(KEY + ".probe", "1"); localStorage.removeItem(KEY + ".probe"); }
catch (e) { storageOK = false; }

function defaultParametre() {
  return {
    r_kredit: 0.060, svind_pct_md: 0.0008, el_beluftning: 0.10,
    anlaeg_aar: 12.00, belaegningsgrad: 0.75, plads_vaerdi_afskrevet: 0.50,
    lagerleje_ekstern: 2.00, ind_udlagring_kr_hkg: 4.00,
    EURDKK: 7.46,
    praemie_broedhvede: 20, merudgift_broedhvede_kr_ha: 700, nedklass_omk: 12,
    toerresats: 1.50, oliebasis_pct: 40.0, oliefaktor: 1.25, renhed_basis: 98,
    udbytte_sikkerhed: 0.80, maks_prehoest_pct: 50, maks_enkelthandel_pct: 35,
    tranche_min_pct: 10, min_dage_mellem_trancher: 21, carry_usikkerhed: 0.50,
    notifikationstid: "07:00", prisrytme: "maaned"
  };
}
function defaultBedrift() {
  return {
    navn: "", momsperiode: "halvaarlig", selskabsform: "personlig",
    egen_lagerkapacitet_hkg: 0, lade_afskrevet: false,
    kassekredit_ramme: 0, kassekredit_traek: 0, traek_maalt_dato: null,
    likviditetsbehov_kr: 0, likviditetsbehov_dato: null
  };
}
function defaultKvalitet() {
  return { vand_pct: null, korntemp_c: null, protein_pct: null, faldtal_sek: null,
    hl_vaegt_kg: null, renhed_pct: null, olie_pct_toerstof: null, DON_ppm: null, FFA_pct: null, maalt_dato: null };
}
function defaultKrav(afgrode) {
  return afgrode === "raps"
    ? { protein_min: null, faldtal_min: null, hl_min: null, vand_maks: 9.0, renhed_min: 98, olie_min: 40 }
    : { protein_min: 11.0, faldtal_min: 250, hl_min: 76, vand_maks: 14.0, renhed_min: 98, olie_min: null };
}
function defaultBe() {
  return { stykomk: null, maskin: null, arbejde: null, kapacitet: null, forpagtning: null,
    renter: null, afskrivning: null, egen_loen: null, egenkapital: null, eu_stoette: 2300,
    be_db_kr_hkg: null, be_kontant_kr_hkg: null, be_fuld_kr_hkg: null };
}
function defaultParti(afgrode = "hvede", hoestaar = new Date().getFullYear()) {
  return {
    id: nyId("p"), afgrode, kvalitetsklasse: afgrode === "hvede" ? "broed" : null, hoestaar,
    maengde_hkg_forventet: null, areal_ha: null, forventet_udbytte_hkg_ha: afgrode === "raps" ? 38 : 80,
    hoestet_maengde_hkg: null, lagerbeholdning_hkg: null,
    minimumspris_kr_hkg: null, maalpris_kr_hkg: null,
    typiske_fradrag_kr_hkg: afgrode === "raps" ? 15 : 6,
    haard_deadline: afgrode === "raps" ? fmtISO(hoestaar, 12, 31) : fmtISO(hoestaar + 1, 6, 30),
    be_input_mode: "kr_hkg", be_grundlag: "foder", medregn_eu_stoette: false, be: defaultBe(),
    lagerform: "egen", kvalitet: defaultKvalitet(), kvalitetskrav: defaultKrav(afgrode),
    lukket: false
  };
}
function emptyState() {
  return {
    schema: SCHEMA, updated: null, lastExportAt: null, lastIcsExportAt: null,
    bedrift: defaultBedrift(), parametre: defaultParametre(),
    partier: [], prislog: [], terminer: [], salg: [], kvalitetslog: [], koeberfrister: [],
    paamindelser: {},
    ui: { aktivFane: "handling", sidsteVerdikt: {}, sidsteBesoeg: null, enhed: "hkg",
      storSkrift: false, onboardet: false, eksempeldata: false, kalGrupper: null,
      prisSidst: { afgrode: "hvede", kvalitet: "broed", leveringsperiode: "spot", kilde: "" } }
  };
}

function migrate(d) {
  if (!d || typeof d !== "object" || Array.isArray(d)) return emptyState();
  if (!Array.isArray(d.partier) || !Array.isArray(d.prislog) || !Array.isArray(d.salg)) return emptyState();
  let s = d;
  if (s.schema === undefined) s = Object.assign({}, s, { schema: 1 });
  if (s.schema === 1) {
    s = Object.assign({}, s, {
      koeberfrister: Array.isArray(s.koeberfrister) ? s.koeberfrister : [],
      schema: 2,
      paamindelser: Array.isArray(s.paamindelser)
        ? Object.fromEntries(s.paamindelser.map(x => [x.key, { status: x.status, tilDato: x.tilDato, seq: 0, hash: "" }]))
        : (s.paamindelser || {})
    });
  }
  if (s.schema > SCHEMA) { readOnly = true; return Object.assign(emptyState(), s); }
  const e = emptyState();
  return Object.assign({}, e, s, {
    bedrift: Object.assign({}, e.bedrift, s.bedrift || {}),
    parametre: Object.assign({}, e.parametre, s.parametre || {}),
    ui: Object.assign({}, e.ui, s.ui || {}, { prisSidst: Object.assign({}, e.ui.prisSidst, (s.ui || {}).prisSidst || {}) }),
    paamindelser: (s.paamindelser && !Array.isArray(s.paamindelser)) ? s.paamindelser : {},
    kvalitetslog: Array.isArray(s.kvalitetslog) ? s.kvalitetslog : [],
    koeberfrister: Array.isArray(s.koeberfrister) ? s.koeberfrister : [],
    terminer: Array.isArray(s.terminer) ? s.terminer : [],
    partier: (s.partier || []).map(p => Object.assign({}, defaultParti(p.afgrode, p.hoestaar), p, {
      be: Object.assign({}, defaultBe(), p.be || {}),
      kvalitet: Object.assign({}, defaultKvalitet(), p.kvalitet || {}),
      kvalitetskrav: Object.assign({}, defaultKrav(p.afgrode), p.kvalitetskrav || {})
    }))
  });
}

let S = emptyState();
let fortryd = null, fortrydTimer = null;

function loadState() {
  if (!storageOK) { S = emptyState(); return; }
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
  if (!raw) { S = emptyState(); return; }
  raaData = raw;
  try { S = migrate(JSON.parse(raw)); }
  catch (e) {
    try {
      Object.keys(localStorage).filter(k => k.indexOf(KEY + ".corrupt") === 0).forEach(k => localStorage.removeItem(k));
      localStorage.setItem(KEY + ".corrupt." + Date.now(), raw);
    } catch (e2) { /* fuldt lager — vi gør hvad vi kan */ }
    S = emptyState();
    S._korrupt = true;
  }
}
function saveState() {
  if (readOnly || !storageOK) return false;
  S.updated = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch (e) { visBanner("bad", "Kunne ikke gemme — browserens lager er fuldt. Eksportér dine data nu."); return false; }
}
/* mutate() bindes ALDRIG til input-events — kun change, blur og klik. */
function mutate(fn, fortrydTekst) {
  const snapshot = JSON.stringify(S);
  fn(S);
  saveState();
  if (fortrydTekst) visFortryd(fortrydTekst, snapshot);
  render();
}
function visFortryd(tekst, snapshot) {
  fortryd = snapshot;
  const host = document.getElementById("toastHost");
  host.innerHTML = '<div class="toast"><span>' + esc(tekst) + '</span><button type="button" id="btnFortryd">Fortryd</button></div>';
  document.getElementById("btnFortryd").onclick = () => {
    if (!fortryd) return;
    S = migrate(JSON.parse(fortryd)); fortryd = null; saveState(); host.innerHTML = ""; render();
  };
  clearTimeout(fortrydTimer);
  fortrydTimer = setTimeout(() => { host.innerHTML = ""; fortryd = null; }, 8000);
}
</script>

<script>
"use strict";
/* -------------------------------------------------------- §3 beregninger */

const partiMaengde = p => fin(p.hoestet_maengde_hkg) !== null ? p.hoestet_maengde_hkg : fin(p.maengde_hkg_forventet);
const hoestIHus = (p, idag) => fin(p.hoestet_maengde_hkg) !== null || idag >= AFGRODE[p.afgrode].hoeststart(p.hoestaar);
function kontraktloft(p, P) {
  if (fin(p.hoestet_maengde_hkg) !== null) return p.hoestet_maengde_hkg;
  const m = fin(p.maengde_hkg_forventet);
  return m === null ? null : m * P.udbytte_sikkerhed;
}
const prisPeriodeForParti = (p, idag) => (idag < AFGRODE[p.afgrode].hoeststart(p.hoestaar) ? "ny_hoest" : "spot");
const partiKvalitet = p => (p.afgrode === "raps" ? "raps" : (p.kvalitetsklasse || "foder"));
const vindueStart = p => (p.afgrode === "raps" ? fmtISO(p.hoestaar, 1, 1) : fmtISO(p.hoestaar - 1, 11, 1));
const partiNavn = p => (p.afgrode === "raps" ? "Raps" : (p.kvalitetsklasse === "broed" ? "Brødhvede" : "Foderhvede")) + " høst " + p.hoestaar;

/* --- Break-even. Alle beløb i kr/ha, resultat i kr/hkg. -------------------- */
function beregnBE(p, P) {
  const b = p.be || {};
  const sum = (...keys) => keys.reduce((a, k) => a + (fin(b[k]) || 0), 0);
  const harKrHa = ["stykomk", "maskin", "arbejde", "kapacitet", "forpagtning", "renter", "afskrivning", "egen_loen", "egenkapital"]
    .some(k => fin(b[k]) !== null && b[k] > 0);
  const S_ = p.medregn_eu_stoette ? (fin(b.eu_stoette) || 0) : 0;
  const u_fuldt = fin(p.forventet_udbytte_hkg_ha);
  const u_efter = (fin(p.hoestet_maengde_hkg) !== null && fin(p.areal_ha)) ? p.hoestet_maengde_hkg / p.areal_ha : null;
  const u_foer = u_fuldt !== null ? u_fuldt * P.udbytte_sikkerhed : null;
  const u = u_efter !== null ? u_efter : u_foer;

  let BE_DB = null, BE_kontant = null, BE_fuld = null, BE_fuld_optimist = null, kilde = "ingen";

  if (p.be_input_mode === "kr_hkg" && (fin(b.be_fuld_kr_hkg) !== null || fin(b.be_db_kr_hkg) !== null)) {
    BE_DB = fin(b.be_db_kr_hkg); BE_kontant = fin(b.be_kontant_kr_hkg); BE_fuld = fin(b.be_fuld_kr_hkg);
    BE_fuld_optimist = BE_fuld; kilde = "kr_hkg";
  } else if (p.be_input_mode === "kr_ha" && harKrHa && u) {
    const kontant = sum("stykomk", "maskin", "arbejde", "kapacitet", "forpagtning", "renter");
    const fuld = kontant + sum("afskrivning", "egen_loen", "egenkapital");
    BE_DB = sum("stykomk") / u;
    BE_kontant = (kontant - S_) / u;
    BE_fuld = (fuld - S_) / u;
    BE_fuld_optimist = u_fuldt ? (fuld - S_) / u_fuldt : BE_fuld;
    kilde = "kr_ha";
  }
  // Brødhvede: merudgiften ligger på OMKOSTNINGSSIDEN. Præmien er indtægt og
  // lægges aldrig til gulvet — ellers stiger kravet hver gang markedet hæver præmien.
  const merud = (p.afgrode === "hvede" && p.kvalitetsklasse === "broed" && p.be_grundlag === "foder" && u)
    ? (fin(P.merudgift_broedhvede_kr_ha) || 0) / u : 0;
  const BE_fuld_eff = BE_fuld === null ? null : BE_fuld + merud;
  const GULV = [BE_fuld_eff, fin(p.minimumspris_kr_hkg)].filter(v => v !== null).reduce((a, v) => Math.max(a, v), -Infinity);
  return {
    u: round2(u), u_efter: round2(u_efter), u_foer: round2(u_foer), kilde, beSat: kilde !== "ingen",
    BE_DB: round2(BE_DB), BE_kontant: round2(BE_kontant), BE_fuld: round2(BE_fuld),
    BE_fuld_eff: round2(BE_fuld_eff), merudgift_broed: round2(merud),
    BE_fuld_optimist: round2(BE_fuld_optimist === null ? null : BE_fuld_optimist + merud),
    GULV: GULV === -Infinity ? null : round2(GULV), stoette_med: !!p.medregn_eu_stoette
  };
}

/* --- Lageromkostning pr. hkg ---------------------------------------------- */
function lagerOmk(netto, p, P) {
  const plads = p.lagerform === "egen"
    ? (S.bedrift.lade_afskrevet ? P.plads_vaerdi_afskrevet : P.anlaeg_aar / (12 * (P.belaegningsgrad || 1)))
    : p.lagerform === "ekstern" ? P.lagerleje_ekstern : 0;
  const n = fin(netto) || 0;
  const L_md = n * P.r_kredit / 12 + n * P.svind_pct_md + P.el_beluftning + plads;
  const L_engangs = p.lagerform === "ekstern" ? P.ind_udlagring_kr_hkg : 0;
  return { plads: round2(plads), L_md: round2(L_md), L_engangs: round2(L_engangs),
    L_ialt: m => round2(m * L_md + L_engangs) };
}

/* --- Carry. Kun ægte sammenligninger: samme prisbegreb i begge ben. -------- */
function terminKrHkg(t, P) {
  const v = fin(t.vaerdi); if (v === null) return null;
  if (t.enhed === "EUR_t") return round2(v * P.EURDKK / 10);
  if (t.enhed === "kr_t") return round2(v / 10);
  return round2(v);
}
function carryBeregning(p, nettoSpot, P, idag, terminer, L) {
  const maaned = idag.slice(0, 7);
  const rel = terminer.filter(t => t.afgrode === p.afgrode && t.kontraktmaaned >= maaned && fin(t.vaerdi) !== null)
    .sort((a, b) => (a.kontraktmaaned < b.kontraktmaaned ? -1 : a.kontraktmaaned > b.kontraktmaaned ? 1 : (a.dato < b.dato ? 1 : -1)));
  const nAf = km => daysBetween(idag, km + "-15") / 30.44;

  const lokale = rel.filter(t => t.type === "lokal_forward");
  if (lokale.length && fin(nettoSpot) !== null) {
    const t = lokale[0];
    const fwdNetto = terminKrHkg(t, P) - (fin(p.typiske_fradrag_kr_hkg) || 0);
    const n = nAf(t.kontraktmaaned);
    if (!(n >= 0.5)) return { form: "lokal_forward", carry: null, grund: "kontraktmåneden er for tæt på", kilde: t };
    const brutto = fwdNetto - nettoSpot;
    return ferdigCarry("lokal_forward", brutto, n, L, P, t);
  }
  // MATIF futures mod futures (basis forkorter sig ud). Aldrig MATIF mod lokal spot.
  const matif = rel.filter(t => t.type === "matif");
  const maaneder = [...new Set(matif.map(t => t.kontraktmaaned))].sort();
  if (maaneder.length >= 2) {
    const m1 = matif.find(t => t.kontraktmaaned === maaneder[0]);
    const m2 = matif.find(t => t.kontraktmaaned === maaneder[1]);
    const n = nAf(m2.kontraktmaaned) - Math.max(0, nAf(m1.kontraktmaaned));
    if (!(n >= 0.5)) return { form: "matif", carry: null, grund: "kontrakterne ligger for tæt", kilde: m2 };
    const brutto = terminKrHkg(m2, P) - terminKrHkg(m1, P);
    return ferdigCarry("matif", brutto, n, L, P, m2);
  }
  return { form: null, carry: null, grund: "ingen terminspris indtastet", kilde: null };
}
function ferdigCarry(form, brutto, n, L, P, kilde) {
  const pr_md = brutto / n;
  return {
    form, kilde, n: round2(n), carry: round2(brutto), carry_pr_md: round2(pr_md),
    carry_net: round2(brutto - (n * L.L_md + L.L_engangs)),
    ratio: L.L_md > 0 ? round2(pr_md / L.L_md) : 999,
    doedzone: Math.abs(pr_md - L.L_md) < P.carry_usikkerhed, grund: null
  };
}

/* --- Prisposition --------------------------------------------------------- */
function prisstat(prislog, afgrode, kvalitet, periode, idag) {
  const fra = addMonths(idag, -12);
  const alle = prislog
    .filter(o => o.afgrode === afgrode && o.kvalitet === kvalitet && (o.leveringsperiode || "spot") === periode
      && isISO(o.dato) && o.dato >= fra && o.dato <= idag && fin(o.pris_kr_hkg) !== null)
    .sort((a, b) => (a.dato < b.dato ? -1 : a.dato > b.dato ? 1 : 0));
  const nyeste = alle.length ? alle[alle.length - 1] : null;
  const sammenlign = alle.slice(0, -1).map(o => o.pris_kr_hkg);
  if (!nyeste) return { nyeste: null, n: 0, niveau: "tynd", percentil: null, min: null, max: null, median: null, spaend: 0 };
  const v = nyeste.pris_kr_hkg;
  let percentil = null;
  if (sammenlign.length) {
    const under = sammenlign.filter(x => x < v).length, lig = sammenlign.filter(x => x === v).length;
    percentil = round2(100 * (under + 0.5 * lig) / sammenlign.length);
  }
  const spaend = alle.length > 1 ? daysBetween(alle[0].dato, alle[alle.length - 1].dato) : 0;
  const sorted = [...alle.map(o => o.pris_kr_hkg)].sort((a, b) => a - b);
  const niveau = (alle.length >= 20 && spaend >= 270) ? "fuld" : (alle.length >= 8 && spaend >= 120) ? "forelobig" : "tynd";
  return {
    nyeste, n: alle.length, spaend, niveau, percentil,
    min: sorted[0], max: sorted[sorted.length - 1],
    median: sorted.length % 2 ? sorted[(sorted.length - 1) / 2] : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2,
    serie: alle
  };
}

/* --- Regnehjælp ----------------------------------------------------------- */
const eurTilKrHkg = (eur, kurs) => (fin(eur) === null ? null : round2(eur * kurs / 10));
const krHkgTilEur = (v, kurs) => (fin(v) === null ? null : round2(v * 10 / kurs));
const krTTilKrHkg = v => (fin(v) === null ? null : round2(v / 10));

// Raps: dansk afregning korrigerer allerede vægten til 9 % vand → fast 0,91.
function olieAfregning(basispris, olie_pct_toerstof, P) {
  if (fin(basispris) === null || fin(olie_pct_toerstof) === null) return null;
  const afregnet = olie_pct_toerstof * 0.91;
  const over = afregnet - P.oliebasis_pct;           // må gerne være negativ: olie under basis giver fradrag
  const tillaeg_pct = over * P.oliefaktor;
  return { afregnet: round2(afregnet), over: round2(over), tillaeg_pct: round2(tillaeg_pct),
    tillaeg_kr: round2(basispris * tillaeg_pct / 100), pris: round2(basispris * (1 + tillaeg_pct / 100)) };
}
function toerring(vand_ind, vand_ud, vaegt_ind, P) {
  if (fin(vand_ind) === null || fin(vand_ud) === null || vand_ind <= vand_ud || vand_ud >= 100) return null;
  const svind_pct = (vand_ind - vand_ud) / (100 - vand_ud) * 100;
  const vaegt_ud = fin(vaegt_ind) !== null ? vaegt_ind * (1 - svind_pct / 100) : null;
  const kr_hkg = P.toerresats * (vand_ind - vand_ud) / 0.5;
  return { svind_pct: round2(svind_pct), vaegt_ud: round2(vaegt_ud), kr_hkg: round2(kr_hkg),
    kr_ialt: vaegt_ud === null ? null : round2(kr_hkg * vaegt_ud) };
}
// Forventet værdi af at satse på brødpræmien. Modelantagelse — ikke en måling.
function evBroedhvede(pris_foder, praemie, faldtal, protein, P) {
  if (fin(pris_foder) === null) return null;
  let Pb = faldtal >= 300 ? 0.95 : faldtal >= 275 ? 0.85 : faldtal >= 250 ? 0.60 : faldtal >= 220 ? 0.25 : 0.05;
  if (fin(protein) !== null) Pb *= protein >= 11.5 ? 1 : protein >= 11.0 ? 0.8 : 0.2;
  const ev = Pb * (pris_foder + praemie) + (1 - Pb) * (pris_foder - P.nedklass_omk);
  return { P: round2(Pb * 100), ev: round2(ev), gevinst: round2(ev - pris_foder) };
}
