<script>
"use strict";
/* ---------------------------------------------------------- §4 salgsplan */

function basisTrancher(p, P) {
  const N = p.hoestaar;
  if (p.afgrode === "raps") return [
    { id: "T1", andel: 15, aabner: fmtISO(N, 1, 1),  deadline: fmtISO(N, 4, 30), betinget: true },
    { id: "T2", andel: 20, aabner: fmtISO(N, 5, 1),  deadline: fmtISO(N, 6, 30), betinget: true },
    { id: "T3", andel: 30, aabner: fmtISO(N, 7, 20), deadline: fmtISO(N, 8, 31), fysisk: true },
    { id: "T4", andel: 20, aabner: fmtISO(N, 9, 1),  deadline: fmtISO(N, 10, 31) },
    { id: "T5", andel: 15, aabner: fmtISO(N, 11, 1), deadline: p.haard_deadline || fmtISO(N, 12, 31), haard: true }
  ];
  return [
    { id: "T1", andel: 10, aabner: fmtISO(N - 1, 11, 1), deadline: fmtISO(N, 3, 31), betinget: true },
    { id: "T2", andel: 15, aabner: fmtISO(N, 4, 1),  deadline: fmtISO(N, 6, 15), betinget: true },
    { id: "T3", andel: 20, aabner: fmtISO(N, 7, 1),  deadline: fmtISO(N, 8, 31), fysisk: true },
    { id: "T4", andel: 20, aabner: fmtISO(N, 10, 1), deadline: fmtISO(N, 11, 30) },
    { id: "T5", andel: 20, aabner: fmtISO(N + 1, 1, 1), deadline: sidsteDagIFebruar(N + 1) },
    { id: "T6", andel: 15, aabner: fmtISO(N + 1, 3, 1), deadline: p.haard_deadline || fmtISO(N + 1, 6, 30), haard: true }
  ];
}

/* T3 er ikke en markedsbeslutning: det korn der ikke kan ligge, skal af sted. */
function trancherMedFysik(p, P) {
  const tr = basisTrancher(p, P).map(t => Object.assign({}, t));
  const hoestet = fin(p.hoestet_maengde_hkg), kap = fin(S.bedrift.egen_lagerkapacitet_hkg);
  const t3 = tr.find(t => t.fysisk);
  if (t3 && hoestet && hoestet > 0 && kap !== null && kap > 0) {
    const kraevet = Math.max(0, (hoestet - kap) / hoestet * 100);
    if (kraevet > t3.andel) {
      const senere = tr.filter(t => t.deadline > t3.deadline);
      const senereSum = senere.reduce((a, t) => a + t.andel, 0);
      const overskud = kraevet - t3.andel;
      if (senereSum > overskud) {
        senere.forEach(t => { t.andel = round2(t.andel * (senereSum - overskud) / senereSum); });
        t3.andel = round2(kraevet); t3.fysisk_tvunget = round2(hoestet - kap);
      }
    }
  }
  return tr;
}

function betingelseOpfyldt(p, t, be) {
  if (be.BE_fuld_eff === null) return false;
  const krav = be.BE_fuld_eff * 1.05, fradrag = fin(p.typiske_fradrag_kr_hkg) || 0;
  const kval = partiKvalitet(p);
  return S.prislog.some(o => o.afgrode === p.afgrode && o.kvalitet === kval && isISO(o.dato)
    && o.dato >= t.aabner && o.dato <= t.deadline && fin(o.pris_kr_hkg) !== null
    && (o.pris_kr_hkg - fradrag) >= krav);
}

/* Ankre = (deadline, kumuleret %). En betinget tranche hvis pris aldrig blev
   nået i vinduet tæller ikke — dens andel ruller videre til næste. */
function planAnkre(p, P, idag, be) {
  const tr = trancherMedFysik(p, P);
  const ankre = [[vindueStart(p), 0]];
  let kum = 0, rullet = 0, forrigeKum = 0;
  const rulledeTrancher = [];
  let sidsteAktive = null;
  tr.forEach((t, i) => {
    const udloebet = t.deadline < idag;
    const springes = t.betinget && udloebet && !betingelseOpfyldt(p, t, be);
    if (springes && i < tr.length - 1) {
      rullet += t.andel; rulledeTrancher.push(t.id); t.sprunget = true; t.andel_eff = 0; return;
    }
    kum += t.andel + rullet; rullet = 0;
    t.kum = round2(kum);
    t.andel_eff = round2(kum - forrigeKum);
    forrigeKum = kum;
    sidsteAktive = t;
    ankre.push([t.deadline, round2(kum)]);
  });
  // Afrunding må aldrig efterlade en rest uden for planen: sidste tranche lukker til 100 %.
  if (ankre.length > 1 && sidsteAktive) {
    const diff = round2(100 - sidsteAktive.kum);
    if (diff) { sidsteAktive.andel_eff = round2(sidsteAktive.andel_eff + diff); sidsteAktive.kum = 100; }
    ankre[ankre.length - 1][1] = 100;
  }
  return { tr, ankre, rulledeTrancher };
}
function planPct(ankre, idag) {
  if (!ankre.length) return 0;
  if (idag <= ankre[0][0]) return 0;
  for (let i = 1; i < ankre.length; i++) {
    if (idag <= ankre[i][0]) {
      const [d0, v0] = ankre[i - 1], [d1, v1] = ankre[i];
      const spand = daysBetween(d0, d1);
      return spand <= 0 ? v1 : round2(v0 + (v1 - v0) * daysBetween(d0, idag) / spand);
    }
  }
  return 100;
}

function planStatus(p, P, idag, be) {
  const total = partiMaengde(p);
  const { tr, ankre, rulledeTrancher } = planAnkre(p, P, idag, be);
  const salgListe = S.salg.filter(s => s.parti_id === p.id).sort((a, b) => (a.dato < b.dato ? -1 : 1));
  const salgSum = salgListe.reduce((a, s) => a + (fin(s.maengde_hkg) || 0), 0);
  // Vandfaldsfordeling: solgt fylder trancherne i rækkefølge, så resten ruller videre.
  let rest = salgSum, rulletRest = 0;
  tr.forEach(t => {
    const andelEff = t.andel_eff === undefined ? t.andel : t.andel_eff;
    t.maal_hkg = total ? round2(andelEff / 100 * total) : null;
    const maal = t.maal_hkg || 0;
    t.solgt_hkg = round2(Math.min(rest, maal));
    rest = Math.max(0, rest - maal);
    t.indfriet = maal > 0 ? t.solgt_hkg >= 0.9 * maal : true;
    t.aktiv = idag >= t.aabner && idag <= t.deadline;
    t.udloebet = t.deadline < idag;
    if (t.udloebet && !t.indfriet && !t.sprunget) rulletRest += maal - (t.solgt_hkg || 0);
  });
  const naeste = tr.find(t => !t.indfriet && !t.sprunget) || null;
  const planPctNu = planPct(ankre, idag);
  const solgtPct = total ? round2(100 * salgSum / total) : 0;
  const afvigelse = round2(solgtPct - planPctNu);
  return {
    tr, ankre, rulledeTrancher, total, salgSum: round2(salgSum), solgtPct, planPctNu, afvigelse,
    rulletRest: round2(rulletRest), naeste, restUsolgt: total ? round2(total - salgSum) : null,
    status: afvigelse > 15 ? "FORUD" : afvigelse < -15 ? "BAGUD" : "PÅ PLAN"
  };
}
</script>

<script>
"use strict";
/* ------------------------------------------------- §5 beslutningsmotoren */

const BAND_RANG = { SAELG_IKKE: 0, VENT: 1, SAELG_HALV: 2, SAELG_TRANCHE: 3, SAELG_NU: 4 };
const BAND_ORD = {
  SAELG_NU: "SÆLG NU", SAELG_TRANCHE: "SÆLG EN TRANCHE", SAELG_HALV: "SÆLG EN HALV TRANCHE",
  VENT: "VENT", SAELG_IKKE: "SÆLG IKKE", FYSISK: "HANDL NU", INGEN_DATA: "LOG EN PRIS",
  REGNESTYKKE: "REGNESTYKKE"
};
const BAND_KLASSE = {
  SAELG_NU: "v-saelg_nu", SAELG_TRANCHE: "v-saelg", SAELG_HALV: "v-saelg", VENT: "v-vent",
  SAELG_IKKE: "v-saelg_ikke", FYSISK: "v-fysisk", INGEN_DATA: "v-info", REGNESTYKKE: "v-info"
};
const capBand = (b, loft) => (BAND_RANG[b] > BAND_RANG[loft] ? loft : b);

/* Fysisk lagerkontrol. Korn rådner uanset om prisen er logget — men en
   måling der er over 30 dage gammel udløser ingen alarm, kun en opgave. */
function fysiskTjek(p, idag) {
  const k = p.kvalitet || {}, krav = p.kvalitetskrav || {};
  const lager = fin(p.lagerbeholdning_hkg);
  if (lager !== null && lager <= 0) return { aktiv: false };
  if (!hoestIHus(p, idag)) return { aktiv: false };
  const alder = isISO(k.maalt_dato) ? daysBetween(k.maalt_dato, idag) : null;
  if (alder === null || alder > 30) {
    return { aktiv: false, opgave: true, alder,
      tekst: "Mål " + (p.afgrode === "raps" ? "vandprocent og temperatur i rapsen" : "vandprocent og temperatur i hveden")
        + (alder === null ? " — der er ingen måling endnu." : " — din seneste måling er " + alder + " dage gammel.") };
  }
  const hoestMd = Number(AFGRODE[p.afgrode].hoeststart(p.hoestaar).slice(5, 7));
  const md = Number(idag.slice(5, 7));
  if (md === hoestMd) return { aktiv: false }; // nyhøstet korn ligger 20-28 °C. Ingen alarm i høstmåneden.
  const vandMaks = p.afgrode === "raps" ? (fin(krav.vand_maks) || 9.0) : (fin(krav.vand_maks) || 14.0);
  const tempMaks = p.afgrode === "raps" ? 15 : 18;
  const efterOkt = md >= 10 || md <= 6;
  const vand = fin(k.vand_pct), temp = fin(k.korntemp_c), ude = fin(k.udeluft_7dogn_c);
  const grunde = [];
  let handling = null;
  if (vand !== null && vand > vandMaks) {
    grunde.push("Vandprocenten er " + nf(vand, 1) + " % — over grænsen på " + nf(vandMaks, 1) + " %.");
    handling = "TØR";
  }
  const varm = temp !== null && ((ude !== null && temp > ude + 5) || (efterOkt && temp > tempMaks));
  if (varm) {
    grunde.push("Korntemperaturen er " + nf(temp, 1) + " °C" + (ude !== null ? " mod " + nf(ude, 1) + " °C udeluft" : "") + ".");
    if (!handling) handling = (ude !== null && ude < temp) ? "KØL / BELUFT" : (efterOkt ? "KØL / BELUFT" : "OMRØR / FLYT");
  }
  if (!grunde.length) return { aktiv: false };
  return { aktiv: true, handling, grunde, alder,
    tekst: grunde.join(" ") + " Det er et fysisk problem — giv det et fysisk svar, ikke et salg." };
}

function grundlagsstyrke(p, be, stat, alderPris, carry) {
  const dele = [
    { ok: be.beSat || fin(p.minimumspris_kr_hkg) !== null, txt: "Dit priskrav (break-even eller minimumspris)" },
    { ok: alderPris !== null && alderPris <= 14, txt: "En prisobservation højst 14 dage gammel" },
    { ok: stat.n >= 8, txt: "Mindst 8 loggede priser (du har " + stat.n + ")" },
    { ok: !!(carry && carry.carry !== null), txt: "En terminspris fra din grovvare" },
    { ok: S.salg.some(s => s.parti_id === p.id) || !!p.salgshistorik_bekraeftet, txt: "Din salgshistorik for partiet" }
  ];
  return { score: dele.filter(d => d.ok).length, dele };
}

function vurderParti(p, idag) {
  const P = S.parametre;
  const periode = prisPeriodeForParti(p, idag);
  const kval = partiKvalitet(p);
  const stat = prisstat(S.prislog, p.afgrode, kval, periode, idag);
  const be = beregnBE(p, P);
  const total = partiMaengde(p);
  const fradrag = fin(p.typiske_fradrag_kr_hkg) || 0;
  const brutto = stat.nyeste ? stat.nyeste.pris_kr_hkg : null;
  const netto = brutto === null ? null : round2(brutto - fradrag);
  const L = lagerOmk(netto === null ? (be.GULV || 180) : netto, p, P);
  const plan = planStatus(p, P, idag, be);
  const carry = netto === null ? { carry: null, grund: "ingen pris logget", form: null }
    : carryBeregning(p, netto, P, idag, S.terminer, L);
  const alderPris = stat.nyeste ? daysBetween(stat.nyeste.dato, idag) : null;
  const fysisk = fysiskTjek(p, idag);
  const gs = grundlagsstyrke(p, be, stat, alderPris, carry);
  const salgListe = S.salg.filter(s => s.parti_id === p.id);
  const salgSum = plan.salgSum;
  const loft = kontraktloft(p, P);
  const rest = plan.restUsolgt;
  const dageTilDeadline = isISO(p.haard_deadline) ? daysBetween(idag, p.haard_deadline) : null;
  const sidsteSalg = salgListe.map(s => s.dato).sort().pop() || null;
  const dageSidenSalg = sidsteSalg ? daysBetween(sidsteSalg, idag) : null;

  const ud = {
    parti_id: p.id, navn: partiNavn(p), afgrode: p.afgrode, dato: idag, periode,
    brutto_spot: brutto, netto_spot: netto, fradrag, gulv: be.GULV, be, L, carry, stat, plan,
    grundlag: gs, fysisk, dageTilDeadline, rest, loft,
    signaler: [], begrundelse: [], advarsler: [], komponenter: {}, score: null,
    anbefaling: "VENT", maengde_hkg: null, limitpris_brutto: null, provenu: null
  };

  /* ---- H0 datagate. Fysikken evalueres alligevel. ---- */
  if (netto === null || alderPris > 14) {
    ud.anbefaling = fysisk.aktiv ? "FYSISK" : "INGEN_DATA";
    ud.handling = fysisk.aktiv ? fysisk.handling : null;
    ud.overskrift = fysisk.aktiv ? fysisk.handling + " — " + partiNavn(p) : "Log en aktuel pris";
    ud.begrundelse = fysisk.aktiv ? [fysisk.tekst]
      : [netto === null ? "Der er ingen pris logget for " + partiNavn(p) + " endnu."
        : "Din seneste pris er " + alderPris + " dage gammel. Beslutningen kan ikke regnes på så gamle tal."];
    if (fysisk.opgave) ud.advarsler.push(fysisk.tekst);
    return ud;
  }

  /* ---- Score ---- */
  const beRef = be.BE_fuld_eff !== null ? be.BE_fuld_eff : be.GULV;
  const r = beRef ? netto / beRef : null;
  let K_be = 0;
  if (r !== null) {
    if (r >= 1.15) K_be = 30; else if (r >= 1.10) K_be = 22; else if (r >= 1.05) K_be = 15;
    else if (r >= 1.00) K_be = 5;
    else if (be.beSat && be.BE_kontant !== null && netto >= be.BE_kontant) K_be = -15;
    else if (be.beSat && be.BE_DB !== null && netto >= be.BE_DB) K_be = -30;
    else if (be.beSat) K_be = -45; else K_be = -20;
  }
  let K_pct = 0;
  if (stat.percentil !== null) {
    if (stat.niveau === "fuld") K_pct = Math.round((stat.percentil - 50) * 0.40);
    else if (stat.niveau === "forelobig") K_pct = Math.round((stat.percentil - 50) * 0.20);
  }
  let K_carry = 0;
  if (carry.carry !== null) {
    if (carry.doedzone) K_carry = 0;
    else if (carry.carry < 0) K_carry = 15;
    else if (carry.ratio < 0.80) K_carry = 12;
    else if (carry.ratio <= 1.20) K_carry = 0;
    else if (carry.ratio <= 2.00) K_carry = -9;
    else K_carry = -15;
  }
  const diff = -plan.afvigelse; // positiv = bagud
  let K_plan = diff >= 25 ? 20 : diff >= 15 ? 14 : diff >= 5 ? 6 : diff > -5 ? 0 : diff > -15 ? -8 : -18;
  if (be.GULV !== null && netto < be.GULV) K_plan = Math.min(K_plan, 0); // hård spærre

  const md = Number(idag.slice(5, 7));
  const SAESON = p.afgrode === "raps"
    ? { 7: -2, 8: -2, 9: 0, 10: 0, 11: 1, 12: 1, 1: 2, 2: 2, 3: 2, 4: 2, 5: 1, 6: 1 }
    : { 7: -2, 8: -2, 9: -1, 10: 1, 11: 1, 12: 1, 1: 1, 2: 2, 3: 2, 4: 2, 5: 2, 6: 0 };
  const K_saeson = SAESON[md] || 0;

  const H2aktiv = (() => {
    const b = S.bedrift;
    if (!(fin(b.kassekredit_ramme) > 0)) return false;
    if (!isISO(b.traek_maalt_dato) || daysBetween(b.traek_maalt_dato, idag) > 30) return false;
    return (fin(b.kassekredit_traek) || 0) / b.kassekredit_ramme > 0.80;
  })();
  const H3aktiv = dageTilDeadline !== null && dageTilDeadline <= 45 && (rest || 0) > 0;
  const K_risiko_op = (fysisk.aktiv ? 15 : 0) + (H2aktiv ? 15 : 0) + (H3aktiv ? 10 : 0);
  let K_risiko_ned = 0;
  if (!hoestIHus(p, idag)) {
    if (plan.solgtPct > 75) K_risiko_ned = -15; else if (plan.solgtPct > 60) K_risiko_ned = -10;
  }

  ud.komponenter = { be: K_be, percentil: K_pct, carry: K_carry, plan: K_plan, saeson: K_saeson,
    risiko: K_risiko_op + K_risiko_ned };
  const score = clamp(50 + K_be + K_pct + K_carry + K_plan + K_saeson + K_risiko_op + K_risiko_ned, 0, 100);
  ud.score = score;

  /* ---- Bånd ---- */
  let band = score >= 85 ? "SAELG_NU" : score >= 70 ? "SAELG_TRANCHE"
    : score >= 58 ? (plan.afvigelse < -5 ? "SAELG_HALV" : "VENT") : score >= 45 ? "VENT" : "SAELG_IKKE";

  /* ---- Hysterese: et bånd skifter først når scoren har krydset med >= 4 point ---- */
  const GRAENSER = { SAELG_NU: 85, SAELG_TRANCHE: 70, SAELG_HALV: 58, VENT: 45 };
  const forrige = S.ui.sidsteVerdikt[p.id];
  if (forrige && forrige.baand && forrige.baand !== band && BAND_RANG[forrige.baand] !== undefined) {
    const op = BAND_RANG[band] > BAND_RANG[forrige.baand];
    const graense = op ? GRAENSER[band] : GRAENSER[forrige.baand];
    if (graense !== undefined && Math.abs(score - graense) < 4) { band = forrige.baand; ud.uaendret_siden = forrige.dato; }
  }

  /* ---- Hard overrides: H1 → H4 → H2 → H3 → H5 → H6 ---- */
  let handling = "SÆLG", overrideTekst = null, tvungenMaengde = null;

  if (fysisk.aktiv) {
    ud.anbefaling = "FYSISK"; handling = fysisk.handling;
    ud.overskrift = fysisk.handling + " — " + partiNavn(p);
    ud.begrundelse = [fysisk.tekst];
    ud.signaler.push({ id: "S5", txt: "Fysisk lagerproblem — se handlingen", prio: 1 });
    ud.fysisk_kort = true;
  }
  if (fysisk.opgave) ud.advarsler.push(fysisk.tekst);

  if (loft !== null && salgSum > loft) {
    const over = round2(salgSum - loft);
    const forventet = fin(p.maengde_hkg_forventet) || 0;
    let daekningskoeb = null;
    if (salgSum > forventet && forventet > 0) {
      const fwd = S.terminer.filter(t => t.afgrode === p.afgrode && t.kontraktmaaned >= idag.slice(0, 7))
        .map(t => terminKrHkg(t, P)).filter(v => v !== null).sort((a, b) => a - b).pop();
      const vaegtet = vaegtetKontraktpris(salgListe);
      if (fwd !== null && vaegtet !== null) daekningskoeb = round2((salgSum - forventet) * Math.max(0, fwd - vaegtet));
    }
    ud.advarsler.push("Du har solgt " + hkg(over) + " ud over dit forsigtighedsloft på "
      + pct(P.udbytte_sikkerhed * 100) + " af forventet høst."
      + (daekningskoeb !== null ? " Dækningskøb koster ca. " + kr(daekningskoeb) + " ved nuværende forwardpris." : ""));
    band = capBand(band, "VENT");
    ud.stop_overkontrahering = true;
  }

  if (H2aktiv && !fysisk.aktiv) {
    const b = S.bedrift;
    const behov = fin(b.likviditetsbehov_kr) > 0 ? b.likviditetsbehov_kr
      : Math.max(0, (fin(b.kassekredit_traek) || 0) - 0.70 * b.kassekredit_ramme);
    tvungenMaengde = netto > 0 ? Math.ceil(behov / netto) : null;
    band = "SAELG_TRANCHE";
    overrideTekst = "Likviditet: dit kassekredittræk er " + pct(100 * (fin(b.kassekredit_traek) || 0) / b.kassekredit_ramme)
      + " af rammen. Tvangssalg om tre måneder bliver dyrere end et planlagt salg i dag.";
    handling = "SÆLG";
  }

  if (H3aktiv && !fysisk.aktiv) {
    const perioder = Math.max(1, Math.ceil(dageTilDeadline / 14));
    tvungenMaengde = Math.ceil((rest || 0) / perioder);
    band = BAND_RANG[band] >= BAND_RANG.SAELG_TRANCHE ? band : "SAELG_TRANCHE";
    overrideTekst = "Hård frist om " + dageTilDeadline + " dage: " + hkg(rest) + " er stadig usolgt. Del resten op i "
      + perioder + " portioner — lageret skal være tomt til ny høst."
      + (be.GULV !== null && netto < be.GULV
        ? " Prisen er under dit krav; det er tabet ved at have ventet, ikke en anbefaling om prisen." : "");
    handling = "SÆLG";
    ud.h3 = true;
  }

  if (!fysisk.aktiv && !H2aktiv && !ud.h3 && be.beSat && be.BE_DB !== null && netto < be.BE_DB) {
    band = "SAELG_IKKE";
    overrideTekst = "Prisen dækker ikke udsæd, gødning og kemi (" + krhkg(be.BE_DB) + ").";
  }

  /* G0 / H6: intet plan- eller scorebaseret signal må give SÆLG under gulvet. */
  if (be.GULV !== null && netto < be.GULV && !fysisk.aktiv && !H2aktiv && !ud.h3) {
    band = capBand(band, "VENT");
    ud.under_gulv = true;
  }

  /* Målpris: det eneste tal han selv har kalibreret. */
  const maal = fin(p.maalpris_kr_hkg);
  if (maal !== null && netto >= maal && !(be.GULV !== null && netto < be.GULV) && !fysisk.aktiv) {
    if (BAND_RANG[band] < BAND_RANG.SAELG_TRANCHE) band = "SAELG_TRANCHE";
    ud.maalpris_naaet = true;
  }

  /* ---- Grundlagsstyrke ---- */
  if (gs.score < 3 && !fysisk.aktiv && !ud.h3) {
    ud.anbefaling = "REGNESTYKKE";
  } else if (!fysisk.aktiv) {
    if (gs.score < 5) band = capBand(band, "SAELG_TRANCHE");
    ud.anbefaling = band;
  }

  /* ---- Mængde + guardrails ---- */
  let maengde = null;
  if (["SAELG_NU", "SAELG_TRANCHE", "SAELG_HALV"].indexOf(ud.anbefaling) >= 0 || (ud.anbefaling === "FYSISK" && handling === "SÆLG")) {
    const naeste = plan.naeste;
    const grundmaengde = naeste ? Math.max(0, (naeste.maal_hkg || 0) - (naeste.solgt_hkg || 0)) + plan.rulletRest
      : (rest || 0);
    maengde = grundmaengde;
    if (ud.anbefaling === "SAELG_NU") {
      const i = plan.tr.indexOf(naeste);
      const efter = i >= 0 && plan.tr[i + 1] ? (plan.tr[i + 1].maal_hkg || 0) : 0;
      maengde = grundmaengde + efter;
    } else if (ud.anbefaling === "SAELG_HALV") maengde = grundmaengde / 2;
    if (tvungenMaengde !== null) maengde = Math.max(maengde, tvungenMaengde);

    if (loft !== null) maengde = Math.min(maengde, Math.max(0, loft - salgSum));       // G3
    if (total) maengde = Math.min(maengde, P.maks_enkelthandel_pct / 100 * total);     // G2a
    if (rest !== null) maengde = Math.min(maengde, rest);

    // G4 førhøstloft — håndhæves på faktiske salg
    if (!hoestIHus(p, idag) && loft !== null) {
      const hStart = AFGRODE[p.afgrode].hoeststart(p.hoestaar);
      const foerhoest = salgListe.filter(s => s.dato < hStart).reduce((a, s) => a + (fin(s.maengde_hkg) || 0), 0);
      const tilladt = Math.max(0, P.maks_prehoest_pct / 100 * loft - foerhoest);
      if (tilladt <= 0) {
        band = capBand(band, "VENT"); ud.anbefaling = capBand(ud.anbefaling, "VENT"); maengde = 0;
        ud.advarsler.push("Du har allerede solgt " + pct(P.maks_prehoest_pct) + " af dit kontraktloft før høst. Sælg ikke mere, før høsten er i hus.");
      } else if (maengde > tilladt) {
        maengde = tilladt;
        ud.advarsler.push("Førhøstloftet skærer forslaget ned til " + hkg(tilladt) + " — resten venter til høsten er i hus.");
      }
    }
    // G2b 21-dages-afstand, undtaget hard overrides
    if (dageSidenSalg !== null && dageSidenSalg < P.min_dage_mellem_trancher
      && !fysisk.aktiv && !H2aktiv && !ud.h3) {
      ud.anbefaling = capBand(ud.anbefaling, "VENT");
      ud.advarsler.push("Du solgte for " + dageSidenSalg + " dage siden. Del salgene med mindst "
        + P.min_dage_mellem_trancher + " dage — ellers sælger du reelt på én dag.");
      maengde = null;
    }
    if (maengde !== null) maengde = Math.round(maengde / 10) * 10;
    if (maengde !== null && maengde <= 0) { maengde = null; ud.anbefaling = capBand(ud.anbefaling, "VENT"); }
  }

  /* G1 inaktivitet */
  if (dageSidenSalg !== null && dageSidenSalg > 75 && plan.solgtPct < plan.planPctNu
    && be.GULV !== null && netto >= be.GULV && BAND_RANG[ud.anbefaling] < BAND_RANG.SAELG_TRANCHE) {
    ud.anbefaling = "SAELG_TRANCHE";
    ud.advarsler.push("Der er gået " + dageSidenSalg + " dage siden dit sidste salg, og du er bagud for planen.");
    if (maengde === null && plan.naeste) maengde = Math.round(Math.max(0, (plan.naeste.maal_hkg || 0) - (plan.naeste.solgt_hkg || 0)) / 10) * 10;
  }
  /* G5 leveringspligt */
  const terminSolgt = salgListe.filter(s => s.kontrakttype === "termin" || s.kontrakttype === "futures")
    .reduce((a, s) => a + (fin(s.maengde_hkg) || 0), 0);
  if (total && terminSolgt > 0.60 * total) {
    ud.advarsler.push("Over 60 % af partiet er solgt på termin/futures. Du har en leveringspligt, også i et dårligt høstår.");
  }

  ud.maengde_hkg = maengde;
  ud.limitpris_brutto = be.GULV === null ? null : Math.ceil(be.GULV + fradrag);
  ud.provenu = maengde !== null && netto !== null ? round2(maengde * netto) : null;
  ud.kroner_pr_10kr = rest !== null ? round2(rest * 10) : null;
  ud.pris_ved_at_vente = rest !== null ? round2(3 * L.L_md * rest) : null;
  ud.handling = handling;

  /* ---- Signaler ---- */
  const sig = ud.signaler;
  if (be.BE_fuld_eff !== null && netto >= be.BE_fuld_eff * 1.15) sig.push({ id: "S1b", txt: "15 % over dit fulde krav", prio: 1 });
  else if (be.BE_fuld_eff !== null && netto >= be.BE_fuld_eff * 1.05) sig.push({ id: "S1", txt: "Over dit fulde krav", prio: 2 });
  if (stat.percentil !== null && stat.percentil >= 80 && stat.niveau !== "tynd" && (be.BE_kontant === null || netto >= be.BE_kontant))
    sig.push({ id: "S2", txt: "Øverste 20 % af de seneste " + stat.spaend + " dage", prio: 1 });
  if (carry.carry !== null && !carry.doedzone && carry.carry_pr_md < L.L_md - P.carry_usikkerhed)
    sig.push({ id: "S3", txt: "Markedet betaler ikke for lagring", prio: 1 });
  if (carry.carry !== null && carry.carry < 0) sig.push({ id: "S3b", txt: "Omvendt marked — tøm lageret", prio: 1 });
  if (plan.solgtPct < plan.planPctNu - 15 && be.GULV !== null && netto >= be.GULV)
    sig.push({ id: "S4", txt: "Catch-up: " + nf(Math.abs(plan.afvigelse), 0) + " % bagud", prio: 2 });
  if (H2aktiv) sig.push({ id: "S6", txt: "Likviditet", prio: 1 });
  if (dageTilDeadline !== null && dageTilDeadline <= 120 && plan.solgtPct < 80)
    sig.push({ id: "S8", txt: "Hård frist om " + dageTilDeadline + " dage — del resten", prio: 1 });
  if (fin(p.hoestet_maengde_hkg) !== null && fin(p.maengde_hkg_forventet) > 0
    && p.hoestet_maengde_hkg / p.maengde_hkg_forventet < 0.85 && plan.solgtPct > 50)
    sig.push({ id: "S11", txt: "Stop forwardsalg — du høstede mindre end forventet", prio: 1 });
  if (p.afgrode === "hvede" && p.kvalitetsklasse === "broed") {
    const pf = nyestePris(p.afgrode, "foder", periode, idag);
    if (pf !== null && brutto !== null && (brutto - pf) < 8) sig.push({ id: "S12", txt: "Brødpræmien er under 8 kr/hkg — overvej at sælge som foder", prio: 3 });
    const ft = fin((p.kvalitet || {}).faldtal_sek);
    if (ft !== null && fin(p.kvalitetskrav.faldtal_min) !== null && ft < p.kvalitetskrav.faldtal_min)
      sig.push({ id: "S13", txt: "Faldtal " + nf(ft, 0) + " er under kontraktens " + nf(p.kvalitetskrav.faldtal_min, 0), prio: 2 });
  }
  if (alderPris > 10) sig.push({ id: "S14", txt: "Prisdata er " + alderPris + " dage gamle", prio: 3 });
  if (ud.maalpris_naaet) sig.unshift({ id: "S15", txt: "Din målpris er nået", prio: 1 });
  S.koeberfrister.forEach(f => {
    if (!isISO(f.dato)) return;
    const d = naesteForekomst(f.dato, f.gentag === "aarlig", idag);
    if (d && daysBetween(idag, d) >= 0 && daysBetween(idag, d) <= 14)
      sig.push({ id: "S16", txt: f.titel + " om " + daysBetween(idag, d) + " dage — din egen frist", prio: 2 });
  });
  sig.sort((a, b) => a.prio - b.prio);

  /* ---- Begrundelse: maks 4 linjer ---- */
  const g = [];
  if (beRef) {
    const afv = (r - 1) * 100;
    g.push(krhkg(netto) + " netto er " + nf(Math.abs(afv), 0) + " % " + (afv >= 0 ? "over" : "under")
      + " dit " + (be.beSat ? "fulde krav" : "eget priskrav") + " på " + krhkg(beRef) + ".");
  }
  if (stat.percentil !== null && stat.niveau !== "tynd") {
    const oeverst = round2(100 - stat.percentil);
    g.push("Du ligger i " + (stat.percentil >= 50 ? "øverste " + nf(oeverst, 0) : "nederste " + nf(stat.percentil, 0))
      + " % af de seneste " + stat.spaend + " dage (n=" + stat.n + ", min " + nf(stat.min, 0) + " / max " + nf(stat.max, 0) + ")"
      + (stat.niveau === "forelobig" ? " — foreløbigt grundlag." : "."));
  } else {
    g.push("Der er endnu ikke priser nok til at sige om " + nf(netto, 0) + " er højt eller lavt (n=" + stat.n + ").");
  }
  if (carry.carry === null) {
    g.push("Indtast hvad din grovvare tilbyder for levering senere — så kan jeg regne ud, om markedet betaler for at lagre.");
  } else if (carry.doedzone) {
    g.push("Markedet betaler " + krhkg(carry.carry_pr_md) + "/md for at lagre; det koster dig " + krhkg(L.L_md)
      + ". Forskellen er mindre end usikkerheden på tallene.");
  } else {
    g.push("Markedet betaler " + krhkg(carry.carry_pr_md) + "/md for at lagre; det koster dig " + krhkg(L.L_md) + "."
      + (carry.carry_pr_md < L.L_md ? " Lagring er et tab her." : " Markedet betaler for at vente."));
  }
  g.push("Du er " + nf(Math.abs(plan.afvigelse), 0) + " procentpoint " + (plan.afvigelse < 0 ? "bagud for" : "forud for")
    + " din egen plan (" + pct(plan.planPctNu) + " planlagt, " + pct(plan.solgtPct) + " solgt).");
  if (overrideTekst) g.unshift(overrideTekst);
  if (ud.maalpris_naaet) g.unshift("Din målpris på " + krhkg(maal) + " er nået — du sagde, du ville sælge her.");
  if (ud.under_gulv) g.unshift("Dit gulv er " + krhkg(be.GULV) + " netto. Buddet er " + krhkg(netto) + ". Du sagde selv, at du ikke sælger her.");
  if (!ud.fysisk_kort) ud.begrundelse = g.slice(0, 4);
  ud.saeson_note = "Årstid vejer kun ±2 point: sæsonmønsteret er et svagt statistisk træk på ca. 8–9 kr/hkg, og cirka hvert tredje år drukner det helt.";

  if (!ud.overskrift) {
    ud.overskrift = ud.anbefaling === "REGNESTYKKE" ? "Regnestykke — grundlaget er for tyndt til et verdikt"
      : maengde ? "Sælg " + hkg(maengde) + " " + partiNavn(p).toLowerCase() + (ud.provenu ? " — ca. " + kr(Math.round(ud.provenu / 1000) * 1000) : "")
        : BAND_ORD[ud.anbefaling] + " — " + partiNavn(p);
  }
  return ud;
}

function vaegtetKontraktpris(salgListe) {
  const faste = salgListe.filter(s => (s.pris_status || "fast") === "fast" && fin(s.pris_kr_hkg) !== null && fin(s.maengde_hkg));
  if (!faste.length) return null;
  const m = faste.reduce((a, s) => a + s.maengde_hkg, 0);
  return m ? round2(faste.reduce((a, s) => a + s.maengde_hkg * s.pris_kr_hkg, 0) / m) : null;
}
function nyestePris(afgrode, kvalitet, periode, idag) {
  const l = S.prislog.filter(o => o.afgrode === afgrode && o.kvalitet === kvalitet
    && (o.leveringsperiode || "spot") === periode && o.dato <= idag && fin(o.pris_kr_hkg) !== null)
    .sort((a, b) => (a.dato < b.dato ? -1 : 1));
  return l.length ? l[l.length - 1].pris_kr_hkg : null;
}
function naesteForekomst(iso, aarlig, idag) {
  if (!isISO(iso)) return null;
  if (!aarlig) return iso;
  const y = Number(idag.slice(0, 4)), m = Number(iso.slice(5, 7)), d = Number(iso.slice(8, 10));
  const iAar = fmtISO(y, m, Math.min(d, daysInMonth(y, m)));
  return iAar >= idag ? iAar : fmtISO(y + 1, m, Math.min(d, daysInMonth(y + 1, m)));
}
function aktivePartier(idag) {
  return S.partier.filter(p => !p.lukket && idag >= vindueStart(p) && (!isISO(p.haard_deadline) || idag <= addDays(p.haard_deadline, 30)));
}
</script>

<script>
"use strict";
/* -------------------------------------------------- §6 kalender og ICS */

const CRLF = "\r\n";
const BS = String.fromCharCode(92);
const icsEscape = s => String(s)
  .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, "")
  .replace(/[\\;,]/g, m => BS + m)
  .replace(/\r\n|\r|\n/g, BS + "n");

function foldLine(line) {                       // 75 oktetter, UTF-8-sikkert
  const bytes = new TextEncoder().encode(line);
  if (bytes.length <= 75) return line;
  const dec = new TextDecoder(); const parts = [];
  let start = 0, limit = 75;
  while (start < bytes.length) {
    let end = Math.min(start + limit, bytes.length);
    while (end > start && end < bytes.length && (bytes[end] & 0xc0) === 0x80) end--;
    parts.push(dec.decode(bytes.subarray(start, end)));
    start = end; limit = 74;
  }
  return parts[0] + parts.slice(1).map(s => CRLF + " " + s).join("");
}
const buildICS = lines => lines.map(foldLine).join(CRLF) + CRLF;
const toUTCStamp = d => d.getUTCFullYear() + p2(d.getUTCMonth() + 1) + p2(d.getUTCDate())
  + "T" + p2(d.getUTCHours()) + p2(d.getUTCMinutes()) + p2(d.getUTCSeconds()) + "Z";
const localStamp = (iso, hh, mm) => iso.replace(/-/g, "") + "T" + p2(hh) + p2(mm) + "00";
const uidFor = key => key + "@kornsalg.local";

function tzOffsetMs(ts, tz) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {
    timeZone: tz, hour12: false, year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit"
  }).formatToParts(new Date(ts)).map(x => [x.type, x.value]));
  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second) - Math.floor(ts / 1000) * 1000;
}
function zonedToUTC(iso, hh, mm, tz) {
  tz = tz || "Europe/Copenhagen";
  const [y, m, d] = iso.split("-").map(Number);
  const naive = Date.UTC(y, m - 1, d, hh, mm, 0);
  const ts = naive - tzOffsetMs(naive, tz);
  return new Date(naive - tzOffsetMs(ts, tz));
}
/* Kl. 02:00-03:00 findes ikke den sidste søndag i marts. */
function dstSikkerTid(iso, hh, mm) {
  const d = zonedToUTC(iso, hh, mm);
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Copenhagen", hour12: false, hour: "2-digit", minute: "2-digit" })
    .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
  if (Number(p.hour) % 24 !== hh || Number(p.minute) !== mm) return { hh: 3, mm: 0, flyttet: true };
  return { hh, mm, flyttet: false };
}

const VTIMEZONE_LINJER = [
  "BEGIN:VTIMEZONE", "TZID:Europe/Copenhagen", "X-LIC-LOCATION:Europe/Copenhagen",
  "BEGIN:DAYLIGHT", "TZOFFSETFROM:+0100", "TZOFFSETTO:+0200", "TZNAME:CEST",
  "DTSTART:19700329T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU", "END:DAYLIGHT",
  "BEGIN:STANDARD", "TZOFFSETFROM:+0200", "TZOFFSETTO:+0100", "TZNAME:CET",
  "DTSTART:19701025T030000", "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU", "END:STANDARD",
  "END:VTIMEZONE"
];

function seqFor(key, indhold) {
  const hash = h32(indhold);
  const cur = S.paamindelser[key] || { seq: 0, hash: "" };
  if (cur.hash && cur.hash !== hash) cur.seq++;
  cur.hash = hash; S.paamindelser[key] = cur;
  return cur.seq;
}

function vevent(o) {
  const t = dstSikkerTid(o.dateISO, o.hh, o.mm);
  const L = ["BEGIN:VEVENT", "UID:" + uidFor(o.key), "DTSTAMP:" + toUTCStamp(o.stamp || new Date()),
    "SEQUENCE:" + (o.seq || 0)];
  L.push("DTSTART;TZID=Europe/Copenhagen:" + localStamp(o.dateISO, t.hh, t.mm));
  const em = t.mm + (o.mins || 30), eh = t.hh + Math.floor(em / 60);
  L.push("DTEND;TZID=Europe/Copenhagen:" + localStamp(o.dateISO, eh % 24, em % 60));
  if (o.rrule) L.push("RRULE:" + o.rrule);
  L.push("SUMMARY:" + icsEscape(o.summary));
  if (o.description) L.push("DESCRIPTION:" + icsEscape(o.description));
  if (o.url) L.push("URL:" + o.url);
  if (o.status) L.push("STATUS:" + o.status);
  L.push("TRANSP:TRANSPARENT", "CATEGORIES:Kornsalg");
  (o.alarms || []).forEach(a => {
    L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEscape(a.text || o.summary),
      "TRIGGER;RELATED=START:" + a.trigger, "END:VALARM");
  });
  L.push("END:VEVENT");
  return L;
}
function buildCalendar(eventLinjer, navn) {
  return buildICS(["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Kornsalg//Salgspaaminder 2.0//DA",
    "CALSCALE:GREGORIAN", "X-WR-CALNAME:" + (navn || "Kornsalg"), "X-WR-TIMEZONE:Europe/Copenhagen",
    ...VTIMEZONE_LINJER, ...eventLinjer.flat(), "END:VCALENDAR"]);
}

function validerICS(txt) {
  const raa = txt.replace(/^\ufeff/, "");
  const fysiske = raa.split(CRLF);
  const forLange = fysiske.filter(l => new TextEncoder().encode(l).length > 75);
  const harLF = /(^|[^\r])\n/.test(raa);
  const slutterKorrekt = raa.endsWith(CRLF);
  const logiske = raa.replace(/\r\n[ \t]/g, "").split(CRLF).filter(Boolean);
  const uids = logiske.filter(l => l.indexOf("UID:") === 0).map(l => l.slice(4));
  const dubletter = uids.filter((u, i) => uids.indexOf(u) !== i);
  const stak = [], props = [], fejl = [];
  for (const l of logiske) {
    if (l.indexOf("BEGIN:") === 0) { stak.push(l.slice(6)); props.push(new Set()); }
    else if (l.indexOf("END:") === 0) {
      const t = stak.pop(), pr = props.pop();
      if (t !== l.slice(4)) fejl.push("BEGIN/END mismatch " + t + "/" + l.slice(4));
      if (t === "VEVENT") ["UID", "DTSTAMP", "DTSTART", "SUMMARY"].forEach(rq => { if (!pr.has(rq)) fejl.push("VEVENT mangler " + rq); });
      if (t === "VALARM" && pr.has("ACTION") && !pr.has("DESCRIPTION")) fejl.push("VALARM mangler DESCRIPTION");
    } else if (stak.length) props[props.length - 1].add(l.split(/[;:]/)[0]);
  }
  if (stak.length) fejl.push("uafsluttet " + stak.join(","));
  for (let i = 0; i < logiske.length; i++) {
    const l = logiske[i];
    if (l.indexOf("RRULE:") === 0 && l.indexOf("UNTIL=") >= 0) {
      let ds = null;
      for (let j = i; j >= 0; j--) if (logiske[j].indexOf("DTSTART") === 0) { ds = logiske[j]; break; }
      if (/UNTIL=\d{8}(?!T)/.test(l) !== /VALUE=DATE:/.test(ds || "")) fejl.push("UNTIL matcher ikke DTSTART-typen: " + l);
    }
  }
  if (/TRIGGER;VALUE=DATE-TIME/.test(raa)) fejl.push("absolut TRIGGER er forbudt");
  if (/DTSTART;VALUE=DATE:/.test(raa)) fejl.push("heldagsevent er forbudt");
  if (!/BEGIN:VTIMEZONE/.test(raa)) fejl.push("VTIMEZONE mangler");
  return { forLange, harLF, slutterKorrekt, dubletter, fejl,
    ok: !forLange.length && !harLF && slutterKorrekt && !dubletter.length && !fejl.length };
}

/* ---- Hvilke påmindelser findes? ---------------------------------------- */
const KAL_GRUPPER = [
  { id: "tranche", navn: "Salgsvinduer (dine trancher)", pakke: "standard", default: true },
  { id: "deadline", navn: "Hårde frister — lageret skal tømmes", pakke: "standard", default: true },
  { id: "lager", navn: "Lager- og kvalitetskontrol", pakke: "standard", default: true },
  { id: "prisrytme", navn: "Fast prisrytme (log prisen)", pakke: "standard", default: true },
  { id: "fast", navn: "Årets faste tjekpunkter", pakke: "standard", default: true },
  { id: "moms", navn: "Momsfrister og momsperioder", pakke: "standard", default: true },
  { id: "koeber", navn: "Dine egne køberfrister", pakke: "standard", default: true },
  { id: "skat", navn: "Skatterater og frivillig indbetaling", pakke: "standard", default: false },
  { id: "marked", navn: "Markedsdatoer (WASDE, MATIF, MARS)", pakke: "marked", default: false }
];
const grupperValgt = () => {
  const v = S.ui.kalGrupper || {};
  const ud = {};
  KAL_GRUPPER.forEach(g => { ud[g.id] = v[g.id] === undefined ? g.default : !!v[g.id]; });
  return ud;
};

function genererEvents(idag) {
  const P = S.parametre, ev = [];
  const [hh, mm] = String(P.notifikationstid || "07:00").split(":").map(Number);
  const appUrl = location.href.split("#")[0];
  const push = o => ev.push(Object.assign({ hh, mm, pakke: "standard", alarms: [{ trigger: "-PT0M" }] }, o));
  const aktive = aktivePartier(idag);
  const sidsteDeadline = aktive.map(p => p.haard_deadline).filter(isISO).sort().pop() || addMonths(idag, 12);
  const untilStamp = iso => toUTCStamp(zonedToUTC(iso, hh, mm));

  /* --- A. Trancher --- */
  aktive.forEach(p => {
    const be = beregnBE(p, P);
    const plan = planStatus(p, P, idag, be);
    const gulvBrutto = be.GULV === null ? null : Math.ceil(be.GULV + (fin(p.typiske_fradrag_kr_hkg) || 0));
    plan.tr.forEach(t => {
      if (t.indfriet || t.sprunget) return;
      if (t.deadline < addDays(idag, -90)) return;
      const mangler = Math.max(0, (t.maal_hkg || 0) - (t.solgt_hkg || 0));
      const desc = partiNavn(p) + ". " + hkg(mangler)
        + " mangler for at følge planen (mål " + pct(t.kum) + " solgt).\n"
        + (fin(p.maalpris_kr_hkg) !== null ? "Din målpris: " + krhkg(p.maalpris_kr_hkg, 0) + " brutto. " : "")
        + (gulvBrutto !== null ? "Dit gulv: " + krhkg(gulvBrutto, 0) + " brutto.\n" : "\n")
        + "Kalenderen kender ikke prisen — åbn appen og se dagens regnestykke.";
      const d14 = addDays(t.deadline, -14);
      if (d14 >= addDays(idag, -90)) push({
        key: "t." + p.id + "." + t.id + ".d14", gruppe: "tranche", dateISO: d14,
        summary: "Tjek " + AFGRODE[p.afgrode].navn + "prisen — " + t.id + "-vinduet lukker om 14 dage",
        description: desc, url: appUrl, gentag: null
      });
      push({
        key: "t." + p.id + "." + t.id + ".due", gruppe: "tranche", dateISO: t.deadline,
        summary: "Tjek " + AFGRODE[p.afgrode].navn + "prisen — " + t.id + " lukker i dag (" + pct(t.andel_eff) + ", " + hkg(t.maal_hkg) + ")",
        description: desc, url: appUrl, alarms: [{ trigger: "-P1D" }, { trigger: "-PT0M" }], gentag: null
      });
    });
    if (isISO(p.haard_deadline) && p.haard_deadline >= addDays(idag, -90)) push({
      key: "t." + p.id + ".deadline", gruppe: "deadline", dateISO: p.haard_deadline,
      summary: "SIDSTE FRIST: " + partiNavn(p) + " skal være solgt og ude",
      description: "Lageret skal være tomt til ny høst.", url: appUrl,
      alarms: [{ trigger: "-P30D" }, { trigger: "-P7D" }, { trigger: "-PT0M" }], gentag: null
    });
    /* --- D. Lagerkontrol --- */
    if (fin(p.lagerbeholdning_hkg) > 0 && isISO(p.haard_deadline) && p.haard_deadline > idag) {
      const start = p.afgrode === "raps" ? idag : fmtISO(Number(idag.slice(0, 4)), Number(idag.slice(5, 7)), 1);
      push({
        key: "l." + p.id + ".kontrol", gruppe: "lager", dateISO: start >= idag ? start : addMonths(start, 1),
        summary: p.afgrode === "raps" ? "Rapslager: mål vand og temperatur (maks 9 % / 8 °C)"
          : "Lagerkontrol " + partiNavn(p) + ": temperatur, lugt, insekter",
        description: p.afgrode === "raps"
          ? "Raps tager varme hurtigt. Mål i midten af partiet, noter i appen, så lagersignalet er friskt. Varmedannelse og frie fedtsyrer kan ikke vindes tilbage."
          : "Mål temperatur flere steder i partiet og noter den i appen.",
        rrule: (p.afgrode === "raps" ? "FREQ=WEEKLY;INTERVAL=2" : "FREQ=MONTHLY;BYMONTHDAY=1") + ";UNTIL=" + untilStamp(p.haard_deadline),
        gentag: p.afgrode === "raps" ? { type: "ugentlig", interval: 2 } : { type: "maanedlig", dag: 1 },
        url: appUrl
      });
    }
  });

  /* --- B. Faste årlige --- */
  [["m.udbytterevision", "Revurder forventet udbytte — opdatér kontraktloftet", 5, 1, "-PT0M"],
   ["m.hoestlogistik", "Hvor meget kan du lagre lagerfast? Resten skal sælges ved høst", 7, 1, "-PT0M"],
   ["m.indlagring", "Indlagringskontrol: vand og nedkøling", 9, 1, "-PT0M"],
   ["m.likviditet", "Likviditetsbudget 12 mdr — undgå tvangssalg i feb-maj", 11, 1, "-PT0M"],
   ["m.varelager", "Mål og vej lager — værdiansættelse til status 31/12", 12, 15, "-P7D"],
   ["m.insekt", "Insektkontrol i lageret (stiger kraftigt apr-jun)", 4, 1, "-PT0M"]
  ].forEach(([key, sum, m, d, trig]) => push({
    key, gruppe: "fast", dateISO: naesteAarlig(m, d, idag), summary: sum,
    rrule: "FREQ=YEARLY;BYMONTH=" + m + ";BYMONTHDAY=" + d, gentag: { type: "aarlig", md: m, dag: d },
    alarms: [{ trigger: trig }], url: appUrl
  }));

  /* --- C. Prisrytme --- */
  if (P.prisrytme !== "ingen" && sidsteDeadline > idag) {
    const r = P.prisrytme === "uge" ? "FREQ=WEEKLY;BYDAY=MO" : P.prisrytme === "14dage" ? "FREQ=WEEKLY;INTERVAL=2;BYDAY=MO" : "FREQ=MONTHLY;BYMONTHDAY=1";
    const start = P.prisrytme === "maaned" ? naesteMaanedsdag(1, idag) : naesteUgedag(1, idag);
    push({
      key: "m.prisrytme", gruppe: "prisrytme", dateISO: start,
      summary: "Tjek kornprisen og log den i Kornsalg",
      description: "To tryk i appen. Uden friske priser kan der ikke regnes et verdikt.",
      rrule: r + ";UNTIL=" + untilStamp(sidsteDeadline),
      gentag: P.prisrytme === "maaned" ? { type: "maanedlig", dag: 1 } : { type: "ugentlig", interval: P.prisrytme === "uge" ? 1 : 2 },
      url: appUrl
    });
  }

  /* --- E. Moms og skat --- */
  const momsTekst = "Generelle datoer, ikke skatterådgivning. Kornindtægt beskattes som hovedregel ved levering. Momsperioden afhænger af din omsætning og kan være ændret — tjek på skat.dk. Tal med din revisor.";
  const mp = S.bedrift.momsperiode;
  if (mp === "halvaarlig") {
    [["o.moms.h1", "Momsfrist (2. halvår forrige år)", 3, 1, "-P14D"],
     ["o.moms.h2", "Momsfrist (1. halvår)", 9, 1, "-P14D"],
     ["o.moms.p1", "Momsperiode slutter 30/6 — et stort salg nu rykker momsen frem", 6, 23, "-PT0M"],
     ["o.moms.p2", "Momsperiode slutter 31/12 — et stort salg nu rykker momsen frem", 12, 24, "-PT0M"]
    ].forEach(([key, sum, m, d, trig]) => push({ key, gruppe: "moms", dateISO: naesteAarlig(m, d, idag), summary: sum,
      description: momsTekst, rrule: "FREQ=YEARLY;BYMONTH=" + m + ";BYMONTHDAY=" + d,
      gentag: { type: "aarlig", md: m, dag: d }, alarms: [{ trigger: trig }], url: appUrl }));
  } else if (mp === "kvartal") {
    push({ key: "o.moms.q", gruppe: "moms", dateISO: naesteKvartal(idag), summary: "Momsfrist (kvartal)",
      description: momsTekst, rrule: "FREQ=YEARLY;BYMONTH=3,6,9,12;BYMONTHDAY=1",
      gentag: { type: "kvartal" }, alarms: [{ trigger: "-P14D" }], url: appUrl });
  } else {
    push({ key: "o.moms.m", gruppe: "moms", dateISO: naesteMaanedsdag(25, idag), summary: "Momsfrist (måned)",
      description: momsTekst, rrule: "FREQ=MONTHLY;BYMONTHDAY=25", gentag: { type: "maanedlig", dag: 25 },
      alarms: [{ trigger: "-P10D" }], url: appUrl });
  }
  if (S.bedrift.selskabsform === "personlig") {
    push({ key: "o.bskat", gruppe: "skat", dateISO: naesteMaanedsdag(20, idag, [6, 12]), summary: "B-skatterate",
      description: momsTekst, rrule: "FREQ=MONTHLY;BYMONTHDAY=20;BYMONTH=1,2,3,4,5,7,8,9,10,11",
      gentag: { type: "maanedlig", dag: 20, undtagen: [6, 12] }, alarms: [{ trigger: "-P7D" }], url: appUrl });
    [["o.frist0107", "Frist 1/7: frivillig indbetaling med fast procenttillæg", 6, 20],
     ["o.frivillig1", "Frivillig indbetaling uden tillæg — senest 31/12", 12, 15],
     ["o.frivillig2", "Sidste chance: frivillig indbetaling inden nytår", 12, 28]
    ].forEach(([key, sum, m, d]) => push({ key, gruppe: "skat", dateISO: naesteAarlig(m, d, idag), summary: sum,
      description: momsTekst, rrule: "FREQ=YEARLY;BYMONTH=" + m + ";BYMONTHDAY=" + d,
      gentag: { type: "aarlig", md: m, dag: d }, url: appUrl }));
  } else {
    [["o.aconto1", "Acontoskat 1. rate", 3, 20], ["o.aconto2", "Acontoskat 2. rate", 11, 20],
     ["o.aconto3", "Frivillig 3. rate acontoskat", 2, 1]
    ].forEach(([key, sum, m, d]) => push({ key, gruppe: "skat", dateISO: naesteAarlig(m, d, idag), summary: sum,
      description: momsTekst, rrule: "FREQ=YEARLY;BYMONTH=" + m + ";BYMONTHDAY=" + d,
      gentag: { type: "aarlig", md: m, dag: d }, alarms: [{ trigger: "-P14D" }], url: appUrl }));
  }

  /* --- F. Egne køberfrister --- */
  S.koeberfrister.forEach(f => {
    if (!isISO(f.dato)) return;
    const d = f.gentag === "aarlig" ? naesteForekomst(f.dato, true, idag) : f.dato;
    if (d < addDays(idag, -90)) return;
    push({
      key: "k." + f.id, gruppe: "koeber", dateISO: d,
      summary: f.titel + (f.koeber ? " — " + f.koeber : ""),
      description: (f.note || "") + (f.tlf ? "\nRing: " + f.tlf : ""),
      rrule: f.gentag === "aarlig" ? "FREQ=YEARLY;BYMONTH=" + Number(f.dato.slice(5, 7)) + ";BYMONTHDAY=" + Number(f.dato.slice(8, 10)) : null,
      gentag: f.gentag === "aarlig" ? { type: "aarlig", md: Number(f.dato.slice(5, 7)), dag: Number(f.dato.slice(8, 10)) } : null,
      alarms: [{ trigger: "-P14D" }, { trigger: "-PT0M" }], url: appUrl
    });
  });

  /* --- Pakke 2: marked --- */
  for (let i = 0; i < 12; i++) {
    const d0 = addMonths(fmtISO(Number(idag.slice(0, 4)), Number(idag.slice(5, 7)), 1), i);
    const y = Number(d0.slice(0, 4)), m = Number(d0.slice(5, 7));
    const wasde = nextBusinessDay(fmtISO(y, m, 10));
    if (wasde >= idag) push({ key: "m.wasde." + y + "-" + p2(m), gruppe: "marked", pakke: "marked", dateISO: wasde,
      summary: "⚠ tjek dato: WASDE (USDA)", description: "USDA's månedlige balancer. Klokkeslættet er kl. 12:00 New York — 17:00 eller 18:00 dansk tid alt efter sommertid. Datoen kan flytte sig; tjek usda.gov.",
      alarms: [{ trigger: "-P3D" }], gentag: null });
    if (m !== 2) {
      const mars = fmtISO(y, m, 24);
      if (mars >= idag) push({ key: "m.mars." + y + "-" + p2(m), gruppe: "marked", pakke: "marked", dateISO: mars,
        summary: "⚠ tjek dato: JRC MARS Bulletin (EU-udbytte, også DK)", description: "EU-Kommissionens udbytteprognoser.",
        alarms: [{ trigger: "-P3D" }], gentag: null });
    }
    if ([3, 5, 9, 12].indexOf(m) >= 0) {
      const udloeb = nextBusinessDay(fmtISO(y, m, 10));
      if (udloeb >= idag) {
        push({ key: "m.ebm_udloeb." + y + "-" + p2(m), gruppe: "marked", pakke: "marked", dateISO: udloeb,
          summary: "MATIF hvede " + p2(m) + "/" + y + " udløber", description: "Likviditeten flytter til næste kontrakt.",
          alarms: [{ trigger: "-P21D" }, { trigger: "-P5D" }], gentag: null });
        const roll = addDays(udloeb, -21);
        if (roll >= idag) push({ key: "m.ebm_roll." + y + "-" + p2(m), gruppe: "marked", pakke: "marked", dateISO: roll,
          summary: "Roll-beslutning: MATIF hvede " + p2(m) + "/" + y + " → næste kontrakt",
          description: "Korrigér for spreadet, ellers tror du fejlagtigt at markedet er faldet.",
          alarms: [{ trigger: "-P14D" }], gentag: null });
      }
    }
    if ([2, 5, 8, 11].indexOf(m) >= 0) {
      const fm = m === 1 ? 12 : m - 1, fy = m === 1 ? y - 1 : y;
      const udloeb = lastBusinessDayOfMonth(fy, fm);
      if (udloeb >= idag) {
        push({ key: "m.eco_udloeb." + y + "-" + p2(m), gruppe: "marked", pakke: "marked", dateISO: udloeb,
          summary: "MATIF raps " + p2(m) + "/" + y + " udløber",
          description: "Raps udløber ca. 5-6 uger tidligere end hvede — let at overse."
            + (m === 5 ? "\nApril-rollet: her prissættes din kommende rapshøst første gang i frontkontrakten." : ""),
          alarms: [{ trigger: "-P21D" }, { trigger: "-P5D" }], gentag: null });
      }
    }
  }
  return ev;
}
const naesteAarlig = (m, d, idag) => {
  const y = Number(idag.slice(0, 4));
  const i = fmtISO(y, m, Math.min(d, daysInMonth(y, m)));
  return i >= idag ? i : fmtISO(y + 1, m, Math.min(d, daysInMonth(y + 1, m)));
};
function naesteMaanedsdag(dag, idag, undtagen) {
  let y = Number(idag.slice(0, 4)), m = Number(idag.slice(5, 7));
  for (let i = 0; i < 18; i++) {
    const iso = fmtISO(y, m, Math.min(dag, daysInMonth(y, m)));
    if (iso >= idag && !(undtagen || []).includes(m)) return iso;
    m++; if (m > 12) { m = 1; y++; }
  }
  return idag;
}
const naesteKvartal = idag => [3, 6, 9, 12].map(m => naesteAarlig(m, 1, idag)).sort()[0];
function naesteUgedag(ugedag, idag) {
  let s = idag;
  for (let i = 0; i < 8; i++) { if (new Date(dnum(s)).getUTCDay() === ugedag) return s; s = addDays(s, 1); }
  return idag;
}
/* Næste forekomst af et event, til visningen i appen. */
function naesteDato(ev, idag) {
  const g = ev.gentag;
  if (!g) return ev.dateISO;
  if (ev.dateISO >= idag) return ev.dateISO;
  if (g.type === "aarlig") return naesteAarlig(g.md, g.dag, idag);
  if (g.type === "maanedlig") return naesteMaanedsdag(g.dag, idag, g.undtagen);
  if (g.type === "kvartal") return naesteKvartal(idag);
  if (g.type === "ugentlig") {
    const iv = g.interval || 1;
    let s = ev.dateISO;
    while (s < idag) s = addDays(s, 7 * iv);
    return s;
  }
  return ev.dateISO;
}

function eksporterICS(pakke) {
  const idag = todayISO();
  const valgt = grupperValgt();
  const alle = genererEvents(idag).filter(e => (e.pakke || "standard") === pakke && valgt[e.gruppe]);
  const stamp = new Date();
  const linjer = alle.map(e => {
    const kvit = S.paamindelser[e.key] || {};
    const afvist = kvit.status === "slettet";
    const indhold = e.dateISO + "|" + e.summary + "|" + (e.description || "") + "|" + (e.rrule || "")
      + "|" + JSON.stringify(e.alarms || []);
    const seq = seqFor(e.key, indhold);
    const gammelt = e.dateISO < idag && !e.gentag;
    return vevent({
      key: e.key, seq: afvist ? seq + 1 : seq, summary: e.summary, description: e.description,
      dateISO: e.dateISO, hh: e.hh, mm: e.mm, rrule: e.rrule, url: e.url, stamp,
      status: afvist ? "CANCELLED" : null,
      alarms: (afvist || gammelt) ? [] : (e.alarms || [])
    });
  });
  const navn = pakke === "marked" ? "Kornsalg marked" : "Kornsalg";
  const txt = buildCalendar(linjer, navn);
  return { txt, antal: alle.length, validering: validerICS(txt), navn };
}

async function leverICS(icsText, filename) {
  const blob = new Blob(["\ufeff" + icsText], { type: "text/calendar;charset=utf-8" });
  try {
    const file = new File([blob], filename, { type: "text/calendar" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "Kornsalg-påmindelser" }); return "shared"; }
      catch (e) { if (e && e.name === "AbortError") return "cancelled"; }
    }
  } catch (e) { /* File-konstruktøren findes ikke overalt */ }
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return "downloaded";
}

<script>
"use strict";
/* ------------------------------------------------------------- §7 graf */
/* 1 SVG-enhed = 1 px. Ingen preserveAspectRatio="none" — den gør cirkler
   til ellipser og aksetekst ulæselig. Akseetiketter er HTML udenom. */
function tegnGraf(host, serie, opt) {
  opt = opt || {};
  const B = Math.max(240, Math.round(host.getBoundingClientRect().width || 320)), H = 150;
  if (!serie || serie.length < 2) {
    host.innerHTML = '<p class="small muted">Log mindst to priser, så tegner jeg kurven her.</p>';
    return;
  }
  const xs = serie.map(o => dnum(o.dato)), ys = serie.map(o => o.pris_kr_hkg);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = Math.max(2, (y1 - y0) * 0.12); y0 -= pad; y1 += pad;
  const mx = 8, my = 10;
  const px = v => mx + (B - 2 * mx) * (x1 === x0 ? 0.5 : (v - x0) / (x1 - x0));
  const py = v => H - my - (H - 2 * my) * (y1 === y0 ? 0.5 : (v - y0) / (y1 - y0));
  const d = serie.map((o, i) => (i ? "L" : "M") + nf(px(dnum(o.dato)), 1).replace(",", ".") + " " + nf(py(o.pris_kr_hkg), 1).replace(",", ".")).join(" ");
  const linjer = [];
  if (fin(opt.gulv) !== null && opt.gulv > y0 && opt.gulv < y1)
    linjer.push('<line x1="0" x2="' + B + '" y1="' + py(opt.gulv).toFixed(1) + '" y2="' + py(opt.gulv).toFixed(1)
      + '" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="5 4"/>');
  if (fin(opt.maal) !== null && opt.maal > y0 && opt.maal < y1)
    linjer.push('<line x1="0" x2="' + B + '" y1="' + py(opt.maal).toFixed(1) + '" y2="' + py(opt.maal).toFixed(1)
      + '" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="5 4"/>');
  const punkter = serie.map(o => '<circle cx="' + px(dnum(o.dato)).toFixed(1) + '" cy="' + py(o.pris_kr_hkg).toFixed(1)
    + '" r="2.6" fill="var(--accent)"><title>' + esc(DK_DATO(o.dato) + ": " + nf(o.pris_kr_hkg, 2) + " kr/hkg") + '</title></circle>').join("");
  host.innerHTML = '<svg viewBox="0 0 ' + B + ' ' + H + '" width="100%" height="' + H + '" role="img" aria-label="Prisudvikling">'
    + linjer.join("") + '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>'
    + punkter + '</svg>'
    + '<div class="graf-akse"><span>' + esc(DK_DATO(serie[0].dato)) + '</span><span>'
    + esc(nf(Math.min(...ys), 0) + "–" + nf(Math.max(...ys), 0) + " kr/hkg") + '</span><span>'
    + esc(DK_DATO(serie[serie.length - 1].dato)) + '</span></div>';
}

/* --------------------------------------------------------------- §8 UI */
const $ = id => document.getElementById(id);
const on = (id, ev, fn) => { const e = $(id); if (e) e.addEventListener(ev, fn); };
const onAll = (sel, ev, fn) => document.querySelectorAll(sel).forEach(e => e.addEventListener(ev, fn));
let bannerEkstra = [];
let grafObserver = null;
function visBanner(type, tekst) { bannerEkstra.push({ type, tekst }); renderBannere(); }

function renderBannere() {
  const b = [];
  if (readOnly) b.push({ type: "bad", tekst: "<strong>Dine data er gemt af en nyere version af siden.</strong> Der bliver ikke gemt noget, før du har opdateret siden (hård genindlæsning)." });
  if (!storageOK) b.push({ type: "bad", tekst: "<strong>Denne browser gemmer ikke data her.</strong> Åbner du siden som en lokal fil eller i et privat vindue, forsvinder alt når du lukker. Læg siden på en webadresse, eller eksportér dine data efter hver gang." });
  if (S._korrupt) b.push({ type: "warn", tekst: "De gemte data kunne ikke læses og er sat til side. Du starter forfra — importér en sikkerhedskopi, hvis du har en." });
  const idag = todayISO();
  const forfaldne = forfaldnePaamindelser(idag);
  if (forfaldne.length) b.push({ type: "warn", tekst: "<strong>" + forfaldne.length + (forfaldne.length === 1 ? " påmindelse er forfaldet" : " påmindelser er forfaldet") + "</strong> siden du sidst var her. Se dem under Påmind." });
  const ms = S.lastExportAt ? Date.parse(S.lastExportAt) : NaN;
  if (S.partier.length && (!Number.isFinite(ms) || Date.now() - ms > 30 * 864e5))
    b.push({ type: "", tekst: "Du har ikke taget en sikkerhedskopi af dine tal i over en måned. <button class='link' id='bnExport'>Eksportér nu</button>" });
  bannerEkstra.forEach(x => b.push(x));
  $("bannere").innerHTML = b.slice(0, 2).map(x => '<div class="banner ' + x.type + '">' + x.tekst + "</div>").join("");
  on("bnExport", "click", eksporterData);
}

function forfaldnePaamindelser(idag) {
  const valgt = grupperValgt();
  return genererEvents(idag)
    .filter(e => valgt[e.gruppe] && (e.pakke || "standard") === "standard")
    .map(e => ({ ev: e, dato: naesteDato(e, idag) }))
    .filter(x => {
      const k = S.paamindelser[x.ev.key] || {};
      if (k.status === "kvitteret" && k.tilDato === x.dato) return false;
      if (k.status === "slettet") return false;
      return x.dato < idag && x.dato >= addDays(idag, -60);
    });
}

/* ------------------------------------------------------ Handling-fanen */
function renderHandling() {
  const idag = todayISO();
  const aktive = aktivePartier(idag);
  if (!aktive.length) {
    return '<div class="card"><h2>Ingen aktive partier</h2>'
      + '<p class="small muted">Opret et parti, så regner jeg på det. Et parti er én afgrøde i ét høstår — fx brødhvede høst ' + new Date().getFullYear() + '.</p>'
      + '<div class="btnrow"><button class="primary" data-act="nytparti">+ Opret parti</button></div></div>';
  }
  const vurderinger = aktive.map(p => vurderParti(p, idag))
    .sort((a, b) => rangering(b) - rangering(a));
  // Husk bandet, så hysteresen har noget at sammenligne med næste gang.
  let aendret = false;
  vurderinger.forEach(v => {
    if (BAND_RANG[v.anbefaling] === undefined) return;

    if (!f || f.baand !== v.anbefaling) { S.ui.sidsteVerdikt[v.parti_id] = { baand: v.anbefaling, score: v.score, dato: idag }; aendret = true; }
  });
  if (aendret) saveState();
  const top = vurderinger[0];
  let html = kortForVurdering(top, true);
  if (vurderinger.length > 1) {
    html += '<div class="card"><h2>Dine øvrige partier</h2><ul class="list">'
      + vurderinger.slice(1).map(v => '<li><div class="l-main"><div class="l-title">' + esc(v.navn) + '</div>'
        + '<div class="l-meta">' + esc(BAND_ORD[v.anbefaling] || v.anbefaling)
        + (v.score !== null ? " · score " + v.score : "") + (v.netto_spot !== null ? " · " + esc(krhkg(v.netto_spot, 0)) + " netto" : "") + '</div></div>'
        + '<div class="l-act"><button class="slim" data-act="vis" data-id="' + esc(v.parti_id) + '">Se</button></div></li>').join("")
      + "</ul></div>";
  }
  const forf = forfaldnePaamindelser(idag).slice(0, 5);
  if (forf.length) {
    html += '<div class="card"><h2>Forfaldne påmindelser</h2><ul class="list">'
      + forf.map(x => '<li><div class="l-main"><div class="l-title">' + esc(x.ev.summary) + '</div>'
        + '<div class="l-meta">' + esc(DK_DATO(x.dato)) + '</div></div>'
        + '<div class="l-act"><button class="slim" data-act="kvitter" data-key="' + esc(x.ev.key) + '" data-dato="' + esc(x.dato) + '">Kvittér</button></div></li>').join("")
      + "</ul></div>";
  }
  html += hurtigPrisKort(top);
  return html;
}
function rangering(v) {
  return (v.fysisk_kort ? 1000 : 0) + (v.h3 ? 500 : 0) + (v.stop_overkontrahering ? 400 : 0)
    + (v.dageTilDeadline !== null && v.dageTilDeadline < 120 ? (120 - v.dageTilDeadline) : 0)
    + (v.score || 0);
}

function kortForVurdering(v, fuld) {
  const kl = BAND_KLASSE[v.anbefaling] || "v-vent";
  const p = S.partier.find(x => x.id === v.parti_id);
